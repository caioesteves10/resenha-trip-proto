<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EEF2F8">
<title>Resenha Trip 2027 · Paris · Munique · Berlim</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Resenha Trip">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#EEF2F8; --ink2:#FFFFFF; --panel:#FFFFFF; --panel2:#F1F5FA; --line:#E1E8F1; --line2:#CBD6E6;
 --text:#152238; --muted:#5D6E88; --dim:#93A1B7;
 --navy:#1B3A6B; --navy2:#12294F; --stripbg:#1B3A6B; --striptext:#FFFFFF;
 --par:#E8722E; --mun:#1B3A6B; --ber:#3E82C4;
 --ok:#1E9E74; --danger:#DC5A46; --warn:#D98A2B; --orange:#E8722E;
 --shadow:0 3px 12px rgba(21,34,56,.05); --shadowlg:0 8px 24px rgba(18,41,79,.14);
 --r:16px;
}
[data-theme="dark"]{
 --bg:#0D1526; --ink2:#141F35; --panel:#16233C; --panel2:#1D2C48; --line:#28374F; --line2:#3A4C68;
 --text:#E7EDF6; --muted:#94A6C0; --dim:#657899;
 --navy:#5B9BD8; --navy2:#3E82C4; --stripbg:#111B2E; --striptext:#F1F5FB;
 --par:#F0894A; --mun:#5B9BD8; --ber:#5B9BD8;
 --ok:#33B98A; --danger:#E56B57; --warn:#E0A03F; --orange:#F0894A;
 --shadow:0 3px 12px rgba(0,0,0,.28); --shadowlg:0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);
 font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;
 max-width:520px;margin:0 auto;min-height:100vh;
 padding-bottom:calc(78px + env(safe-area-inset-bottom));
 font-feature-settings:"tnum" 1,"cv05" 1}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:calc(200px + env(safe-area-inset-top));pointer-events:none;z-index:0;background:var(--bg)}
.wrap{position:relative;z-index:1;overflow-x:clip;padding:calc(14px + env(safe-area-inset-top)) 14px 0;
 padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
.hidden{display:none!important}
b{font-weight:700}
a{color:var(--mun)}

/* ---------- tipografia ---------- */
.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.03}
.kicker{font-size:10.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;color:var(--dim)}
.sect{font-size:11px;letter-spacing:.15em;font-weight:800;text-transform:uppercase;color:var(--muted);
 display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 2px 8px}
.sect:first-child{margin-top:6px}
.sect .r{letter-spacing:.02em;font-size:12px;font-weight:600;color:var(--dim);text-transform:none}
.money{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- cabeçalho / boarding strip ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topbar .kicker{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:11px;
 width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex:0 0 auto}
.iconbtn:active{background:var(--panel2)}
.iconbtn.on{border-color:var(--orange);color:var(--orange)}
.iconbtn#viabtn.viaoff{border-color:var(--line2);color:var(--dim);position:relative}
.iconbtn#viabtn.viaoff::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:1.5px;background:var(--dim);transform:rotate(-20deg)}
/* interruptor do modo viagem (avião) */
.viasw{position:relative;width:46px;height:27px;border-radius:99px;border:none;background:#c9d2de;cursor:pointer;padding:0;flex:0 0 auto;transition:background .18s;-webkit-tap-highlight-color:transparent}
[data-theme="dark"] .viasw{background:#3a4658}
.viasw.on{background:var(--orange)}
.viasw-knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .18s}
.viasw.on .viasw-knob{transform:translateX(19px)}
.viasw-knob svg{width:12px;height:12px;color:#8a94a3;transition:color .18s}
.viasw.on .viasw-knob svg{color:var(--orange)}

/* botão flutuante "+ gasto" (aparece no modo viagem) */
.fab{position:fixed;z-index:45;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));
 width:54px;height:54px;border-radius:50%;border:none;background:var(--orange);color:#fff;
 display:flex;align-items:center;justify-content:center;cursor:pointer;
 box-shadow:0 6px 18px rgba(232,114,46,.45);transition:transform .12s ease,box-shadow .15s ease,opacity .2s ease}
.fab:hover{transform:scale(1.06)}
.fab:active{transform:scale(.94)}
.fab:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.fab.hidden{display:none}
.me-chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);
 border-radius:99px;padding:4px 5px 4px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
.me-chip button{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);border-radius:99px;
 padding:3px 9px;font-size:10.5px;font-weight:700;cursor:pointer}

.strip{position:relative;background:var(--stripbg);color:var(--striptext);
 border:1px solid var(--stripbg);border-radius:var(--r);padding:11px 15px 9px;overflow:hidden;margin-bottom:8px;box-shadow:var(--shadowlg)}
.strip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange)}
.strip .route{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:rgba(255,255,255,.82);flex-wrap:wrap}
.strip .route .ar{color:rgba(255,255,255,.4);font-weight:600}
.strip h1{font-size:26px;margin:4px 0 2px}
.strip .when{color:rgba(255,255,255,.72);font-size:12.5px;font-weight:600}
.strip .cd{position:absolute;right:14px;top:12px;text-align:right}
.wkchip{display:none}
.wkchip.on{display:inline-block;margin-top:5px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
 background:var(--orange);color:#fff;border-radius:99px;padding:3px 8px}
.strip .cd .n{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:26px;line-height:1;color:var(--par)}
.strip .cd .u{font-size:9.5px;letter-spacing:.16em;font-weight:800;color:rgba(255,255,255,.55);text-transform:uppercase}
.perf{height:1px;margin:7px -15px 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px)}
.fxconvbtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:22px;margin-left:2px;
 background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);
 border-radius:99px;cursor:pointer;transition:background .15s,transform .08s;flex:0 0 auto}
.fxconvbtn:hover{background:rgba(255,255,255,.2)}
.fxconvbtn:active{transform:scale(.9)}
.fxconvbtn svg{color:var(--orange)}

/* ---------- painéis genéricos ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:9px;box-shadow:var(--shadow)}
.card.okline{border-color:rgba(30,158,116,.4)}
.card.tight{padding:11px 13px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{margin-left:auto}
.empty{color:var(--dim);text-align:center;padding:22px 14px;border:1px dashed var(--line);border-radius:14px;font-size:13.5px;line-height:1.6}
.note{color:var(--dim);font-size:11.5px;line-height:1.6;margin-top:8px}
.foot{color:var(--dim);text-align:center;font-size:11.5px;margin:22px 8px 4px;line-height:1.7}
.warnbox{background:#FDF3E4;border:1px solid #F0D5A8;color:#9A6512;border-radius:12px;padding:10px 12px;font-size:12px;margin:0 0 12px;line-height:1.5}
.okbox{background:#E4F5EE;border:1px solid #A9DCC9;color:#137A57;border-radius:12px;padding:10px 12px;font-size:12px;margin:0 0 12px;line-height:1.5}

/* ---------- formulários ---------- */
input,select,textarea{background:var(--panel);border:1px solid var(--line2);color:var(--text);
 border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit;width:100%;outline:none;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--mun)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
 background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
label.f{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--dim);margin:0 0 5px 2px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.fld{margin-bottom:9px}
.btn{background:var(--orange);border:none;color:#fff;border-radius:12px;padding:13px 16px;font-size:15px;
 font-weight:800;width:100%;cursor:pointer;font-family:inherit}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--panel2);color:var(--navy);border:1px solid var(--line2)}
.btn.navy{background:var(--navy);color:#fff;border:none}
.btn.navy .bic{display:inline-flex;vertical-align:-2px;margin-right:7px}
.btn.navy .bic svg{width:16px;height:16px;display:block}
.btn.gh{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px}
.btn.dgr{background:transparent;border:1px solid #6B2A22;color:var(--danger)}
.err{color:var(--danger);font-size:12.5px;text-align:center;margin-top:9px;min-height:16px;font-weight:600}
.x{background:transparent;border:none;color:var(--dim);font-size:17px;cursor:pointer;padding:4px 6px;line-height:1;flex:0 0 auto}
.x:active{color:var(--danger)}

/* chips de pessoa */
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* split por % no modal de despesa */
.segmini{margin-bottom:0}
.segmini div{padding:7px 10px;font-size:12.5px}
.pctrow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.pctname{flex:0 0 88px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pctinp{flex:0 0 62px;text-align:right;padding:6px 8px!important}
.pctsign{color:var(--muted);font-weight:700;font-size:13px;margin-left:-4px}
.pctcash{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.pctsum{margin-top:8px;font-size:12.5px;font-weight:800;text-align:right}
.pctsum.ok{color:var(--ok)}
.pctsum.falta{color:var(--orange)}
.chip{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:99px;
 padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.solo.on{border-color:var(--par)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;
 overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg div{flex:1 0 auto;white-space:nowrap;text-align:center;padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--muted);border-radius:9px;cursor:pointer}
.seg div.on{background:var(--panel);color:var(--navy);box-shadow:var(--shadow)}
.catfilter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.catchip{font-size:12px;font-weight:700;color:var(--muted);background:var(--panel2);border:1px solid var(--line);
 border-radius:99px;padding:5px 12px;cursor:pointer;transition:background .12s,color .12s,border-color .12s;white-space:nowrap;
 display:inline-flex;align-items:center}
.catchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.catchip:active{transform:scale(.95)}
/* faixa de "nova versão disponível" */
#upbar{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:70;
 background:var(--navy);color:#fff;border-radius:13px;padding:11px 12px 11px 15px;
 display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadowlg);
 font-size:13.5px;font-weight:700;transform:translateY(20px);opacity:0;transition:transform .3s,opacity .3s}
#upbar.on{transform:none;opacity:1}
#upbar button{background:var(--orange);color:#fff;border:none;border-radius:9px;padding:8px 15px;
 font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
@media (min-width:900px){#upbar{left:auto;right:20px;bottom:20px;max-width:340px}}
/* status de sincronização */
#syncbar{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
 border-radius:10px;padding:8px 11px;margin-bottom:10px}
#syncbar.off{background:#FEF3C7;color:#92400E}
#syncbar.pend{background:var(--panel2);color:var(--muted)}
#syncbar .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
#syncbar.off .dot{background:#D97706}
#syncbar.pend .dot{background:var(--orange);animation:pulseDot 1.1s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.3}}
/* Mala (sub-aba do checklist) */
.mala-hero{display:flex;align-items:center;gap:16px;background:var(--navy);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadowlg)}
.mala-bag{position:relative;flex:0 0 auto;width:60px;height:60px;color:rgba(255,255,255,.92)}
.mala-bag svg{width:60px;height:60px;display:block}
.mala-fillrect{transition:y .5s cubic-bezier(.2,.7,.3,1),height .5s cubic-bezier(.2,.7,.3,1)}
.mala-heroinfo{flex:1;min-width:0}
.mala-msg{font-size:12.5px;font-weight:700;color:var(--orange);margin-top:2px}
.mala-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:8px}
.mala-bar i{display:block;height:100%;border-radius:99px;background:var(--orange);transition:width .5s cubic-bezier(.3,1,.4,1)}
.mala-bar.sm{height:5px;background:var(--panel2);margin-top:5px}
.mala-bar.sm i{background:var(--navy)}
.mala-bar.sm i.done{background:var(--ok)}
.malaprog[hidden]{display:none}
.malaprog{margin-bottom:6px}
.mpg-row{margin-bottom:9px}
.mpg-top{display:flex;align-items:center;font-size:12.5px;font-weight:700}
.mpg-cat{display:inline-flex;align-items:center;color:var(--text)}
.mpg-n{margin-left:auto;color:var(--muted);font-size:11.5px}
.mala-tpl-row{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:12.5px}
.mala-tpl-row .lnk{font-weight:700}
.tpl-list{display:flex;flex-direction:column;gap:8px}
.tpl-it{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.tpl-info{flex:1;min-width:0}
.tpl-n{font-size:14px;font-weight:700}
.tpl-s{font-size:11.5px;color:var(--muted);margin-top:1px}
.li .t .s{font-size:11.5px;color:var(--dim);margin-top:2px;font-weight:600}
/* divisor de restaurante */
.rest-box{max-width:520px}
.rest-sec{font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center}
.rest-grand{font-size:14px;color:var(--navy);text-transform:none;letter-spacing:0}
.rst-item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.rst-item-top{display:flex;gap:7px;align-items:center}
.rst-nome{flex:1;min-width:0}
.rst-val{width:88px;flex:0 0 auto;text-align:right}
.rst-del{flex:0 0 auto}
.rst-quem{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rst-chip{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 11px;cursor:pointer;transition:all .12s;white-space:nowrap}
.rst-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rst-chip:active{transform:scale(.94)}
.rst-inrow{display:flex;gap:6px}
.rst-inrow input{flex:1;min-width:0}
.rst-unit{flex:0 0 auto;width:54px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-weight:800;color:var(--navy);cursor:pointer;font-size:13px}
.rst-unit:active{transform:scale(.94)}
.rst-tot{background:var(--panel2);border-radius:12px;padding:10px 12px}
.rst-totrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:14px;font-weight:600}
.rst-totrow b{color:var(--navy);font-weight:800}
.rst-totrow.rst-sub{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:11.5px;color:var(--dim);font-weight:600}
.rst-pags{display:flex;flex-direction:column;gap:7px}
.rst-pagrow{display:flex;align-items:center;gap:9px}
.rst-pagval{flex:1;min-width:0}
.rst-totchk{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.rst-totchk input{width:15px;height:15px;accent-color:var(--navy);cursor:pointer;margin:0}
.rst-actions{display:flex;gap:9px;margin-top:14px}
.rst-actions .btn{flex:1}

/* ---------- barra inferior ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
 padding:7px 4px calc(6px + env(safe-area-inset-bottom));display:flex;max-width:520px;margin:0 auto}
.nav .navsum{display:none}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 1px;
 color:var(--dim);font-size:8.8px;font-weight:700;letter-spacing:0;cursor:pointer;border-radius:10px;white-space:nowrap}
.nav div .ic{width:23px;height:23px;display:flex;align-items:center;justify-content:center}
.nav div .ic svg{width:23px;height:23px;color:var(--dim)}
.nav div.on .ic svg{color:var(--orange)}
.nav div.on{color:var(--navy)}
.nav div.on .ic{filter:none}
.navdot{width:16px;height:2px;border-radius:2px;background:transparent;margin-top:1px}
.nav div.on .navdot{background:var(--orange);width:20px}

.panel-v{display:none}
.panel-v.on{display:block}

/* ---------- trilho de progresso ---------- */
.rail{position:relative;height:10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:12px 0 8px}
.rail i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;
 background:var(--orange);transition:width .5s cubic-bezier(.3,1,.4,1)}
.rail.ok i{background:var(--ok)}
.rail.dgr i{background:var(--danger)}
.ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);font-weight:700;letter-spacing:.08em;margin-bottom:2px}

/* hero do cofre */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero .lab{font-size:10.5px;letter-spacing:.18em;font-weight:800;text-transform:uppercase;color:var(--dim)}
.hero .big{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:36px;line-height:1.05;margin:3px 0 2px;letter-spacing:-.02em}
.hero .of{color:var(--muted);font-size:13px;font-weight:600}
.hero .pct{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:26px;font-weight:800;color:var(--par);align-self:flex-start;line-height:1.2}
.hero.done .pct{color:var(--ok)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.kpi .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--dim)}
.kpi .v{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}

/* lista de depósitos com scroll */
.deplist{max-height:236px;overflow-y:auto;-webkit-overflow-scrolling:touch;
 border:1px solid var(--line);border-radius:14px;padding:8px 8px 1px;margin-bottom:2px;
 -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent);
 mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent)}
.deplist .li{margin-bottom:7px}
.deplist::-webkit-scrollbar{width:5px}
.deplist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

/* botão "ver histórico e a família" (colapsa a parte densa do Cofre) */
.mais-btn{width:100%;margin:16px 0 4px;padding:11px 14px;display:flex;align-items:center;justify-content:center;gap:8px;
 background:transparent;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);
 font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease}
.mais-btn:hover{background:var(--panel2);color:var(--text);border-color:var(--dim)}
.mais-btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mais-ch{font-size:15px;line-height:1;transition:transform .2s ease}
.mais-btn.aberto .mais-ch{transform:rotate(180deg)}
.cofre-mais[hidden]{display:none}
.plano-mais[hidden]{display:none}
.cseg-hint{margin:8px 2px 12px;color:var(--muted);font-size:12px;line-height:1.4}

/* meses do cofre */
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.ml{font-size:12px;font-weight:700;color:var(--muted);flex:0 0 50px}
.mb{flex:1;height:6px;border-radius:3px;background:var(--ink2);overflow:hidden}
.mb i{display:block;height:100%;border-radius:3px;background:var(--orange)}
.mv{font-size:13.5px;font-weight:700;flex:0 0 auto}

/* rótulos, links e selos */
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--dim)}
.lnk{color:var(--mun);font-weight:700;cursor:pointer;border-bottom:1px dashed rgba(90,169,230,.45)}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);
 color:var(--muted);border-radius:99px;padding:5px 11px;white-space:nowrap;flex:0 0 auto}
.badge.on{border-color:var(--ok);color:var(--ok);background:rgba(30,158,116,.1)}

/* listas */
.li{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
 border-radius:13px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.li .t{flex:1;min-width:0}
.li .t .n{font-size:14.5px;font-weight:600;word-break:break-word}
.li .t .s{font-size:11.5px;color:var(--dim);margin-top:2px}
.li .v{font-size:15px;font-weight:800;white-space:nowrap}
.li.done{opacity:.5}
.li.done .t .n{text-decoration:line-through}
.tick{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:1.5px solid var(--line2);background:var(--panel);
 display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;cursor:pointer}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pill{font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:7px;padding:3px 7px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.par{border-color:rgba(228,87,126,.5);color:var(--par)}
.pill.mun{border-color:rgba(90,169,230,.5);color:var(--mun)}
.pill.ber{border-color:rgba(240,169,59,.5);color:var(--ber)}
.pill.ok{border-color:rgba(60,201,160,.5);color:var(--ok)}
.pill.dgr{border-color:rgba(232,101,79,.5);color:var(--danger)}

/* tabela compacta */
.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800;text-align:right;padding:0 0 7px}
.tb th:first-child{text-align:left}
.tb td{padding:9px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tb td:first-child{text-align:left;font-weight:600}
.tb tr.me td{color:var(--text)}
.tb tr.me td:first-child{color:var(--par)}
.tb tfoot td{border-top:1px solid var(--line2);font-weight:800}

/* roteiro */
.hoje-card{background:var(--navy);color:#fff;border-radius:16px;padding:15px 16px;margin-bottom:10px;box-shadow:var(--shadowlg)}
.hoje-act{font-size:13.5px;padding:4px 0;border-top:1px solid rgba(255,255,255,.14)}
.hoje-act:first-of-type{border-top:none}

/* ---------- aba Início (resumo) ---------- */
.ini-hero{position:relative;background:var(--stripbg);color:var(--striptext);border-radius:var(--r);
 padding:18px 18px 16px;margin-bottom:11px;overflow:hidden;box-shadow:var(--shadowlg)}
.ini-hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange)}
.ini-hero.viax::before{background:var(--ok)}
.ini-hero-lbl{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.6)}
.ini-hero-big{display:flex;align-items:baseline;gap:9px;margin-top:6px;flex-wrap:wrap}
.ini-hero-n{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:46px;line-height:1;color:var(--par);letter-spacing:-.02em}
.ini-hero.viax .ini-hero-n{color:#fff}
.ini-hero-u{font-size:14px;font-weight:700;color:rgba(255,255,255,.85)}
.ini-hero-sub{margin-top:8px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.72)}
.ini-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:9px;
 box-shadow:var(--shadow);cursor:pointer;transition:transform .08s ease,border-color .15s ease}
.ini-card:active{transform:scale(.99)}
.ini-card:hover{border-color:var(--line2)}
.ini-card:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.ini-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ini-ic{width:19px;height:19px;flex:0 0 auto;display:flex;color:var(--muted)}
.ini-ic svg{width:19px;height:19px}
.ini-t{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.ini-go{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--dim)}
.ini-big{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:21px;line-height:1.12;letter-spacing:-.01em}
.ini-sub{margin-top:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.ini-row{display:flex;align-items:center;gap:10px}
.ini-line{flex:1;min-width:0;font-size:15px;font-weight:600}
.ini-line b{color:var(--text)}
.ini-line.ini-ok{color:var(--ok);font-weight:700}
.ini-line.ini-dgr b{color:var(--danger)}
.ini-pct{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:22px;color:var(--par);line-height:1}
.ini-pct.ok{color:var(--ok)}
.ini-big.money{font-family:'Bricolage Grotesque',Inter,sans-serif}
.gd-day{text-align:center;flex:0 0 auto;padding-left:10px}
.gd-day-n{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:26px;line-height:1;color:var(--navy)}
.gd-day-l{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:1px}
.gd-chart{display:flex;align-items:flex-end;gap:3px;height:34px;margin:8px 0 8px}
.gd-verba{display:flex;gap:8px;margin:6px 0 8px;padding:10px;background:var(--panel2);border-radius:12px}
.gd-vcol{flex:1;text-align:center;min-width:0}
.gd-vk{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.gd-vv{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:15px;margin-top:2px;white-space:nowrap}
.gd-vhi{background:var(--panel);border-radius:9px;padding:2px 4px;box-shadow:var(--shadow)}
.gd-vhi .gd-vv{color:var(--orange)}
.gd-bar{flex:1;min-width:2px;background:var(--line2);border-radius:2px 2px 0 0;transition:height .3s ease}
.gd-bar.hoje{background:var(--orange)}
.gd-bar.fut{background:var(--panel2);border:1px dashed var(--line2)}
.ini-line-sm{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.4}
.ini-line-sm b{color:var(--text)}
.ini-line-sm.ini-ok{color:var(--ok)}
.ini-line-sm.ini-dgr{color:var(--danger)}
.ini-line-sm.ini-dgr b{color:var(--danger)}

/* ---------- onboarding (dicas) ---------- */
.intro-list{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.intro-it{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--text)}
.intro-ic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
 display:flex;align-items:center;justify-content:center;color:var(--orange)}
.intro-ic svg{width:19px;height:19px}
.intro-it b{color:var(--navy);font-weight:800}
.searchbar{position:relative;margin-bottom:10px}
.searchbar input{width:100%;padding-right:38px}
.searchbar button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--panel2);border:1px solid var(--line2);color:var(--muted);border-radius:99px;width:26px;height:26px;cursor:pointer}
.day{position:relative;padding-left:26px;margin-bottom:14px}
.day::before{content:"";position:absolute;left:7px;top:20px;bottom:-14px;width:2px;background:var(--line)}
.day:last-child::before{display:none}
.day .dot{position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--muted)}
.day.par .dot{background:var(--par)} .day.mun .dot{background:var(--mun)} .day.ber .dot{background:var(--ber)}
.day .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.day .dh .d{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:16px;font-weight:800}
.day .dh .c{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.day.par .dh .c{color:var(--par)} .day.mun .dh .c{color:var(--mun)} .day.ber .dh .c{color:var(--ber)}
.day-count{font-size:10.5px;font-weight:800;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;flex:0 0 auto}
.day-past{opacity:.62}
.day-past .dot{background:var(--muted)!important;opacity:.6}
.act{position:relative;display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
.act .h{font-size:12.5px;font-weight:800;color:var(--navy);flex:0 0 46px;padding-top:1px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.act .h .h-livre{color:var(--dim);font-weight:700;font-size:11px}
.act .b{flex:1;min-width:0;border-left:1px solid var(--line);padding-left:11px}
.act .b .n{font-size:14.5px;font-weight:600}
.act .b .s{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
.act .b .s a{word-break:break-all}
/* link "abrir no mapa" (roteiro, próximo passeio, início) */
.maplink{display:inline-flex;align-items:center;gap:5px;max-width:100%;color:var(--orange);font-weight:700;font-size:12.5px;text-decoration:none;line-height:1.3}
.maplink svg{width:13px;height:13px;flex:none}
.maplink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maplink:hover{text-decoration:underline}
.maplink:active{opacity:.7}
.maplink.on-dark{color:#fff;opacity:.94}
/* reservas & documentos */
.resv{margin-bottom:8px}
.resv .row{align-items:flex-start;gap:8px}
.resv-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.resv-t{font-size:15px;font-weight:700;color:var(--navy);line-height:1.3}
.resv .s{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.55}
.resv .s b{color:var(--navy);font-variant-numeric:tabular-nums}
.resv-who{font-size:11px;color:var(--muted);font-weight:700}
.resv-links{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.resv-copy{margin-left:6px;font-size:11px;color:var(--mun);font-weight:700;cursor:pointer;background:none;border:none;padding:0;text-decoration:underline}
/* passeio marcado como feito durante a viagem */
.act.act-done{opacity:.55}
.act.act-done .b .n{text-decoration:line-through;text-decoration-color:var(--dim)}
.actcheck{flex:0 0 24px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);
 background:var(--panel);color:#fff;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;
 padding:0;transition:background .15s,border-color .15s,transform .1s;margin-top:1px}
.actcheck.on{background:var(--ok);border-color:var(--ok)}
.actcheck:active{transform:scale(.88)}
.hoje-act.done{opacity:.5;text-decoration:line-through}
/* cidade como filtro clicável */
.citychip{transition:transform .1s,box-shadow .15s,opacity .15s}
.citychip:active{transform:scale(.94)}
.citychip.sel{box-shadow:0 0 0 2px var(--navy);opacity:1}
.citychip:not(.sel){opacity:.72}
.row:has(.citychip.sel) .citychip:not(.sel){opacity:.5}

/* acerto */
.tr{display:flex;align-items:center;gap:10px;background:var(--panel);
 border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.tr .who{flex:1;font-size:14px;font-weight:700}
.tr .who .ar{color:var(--dim);margin:0 6px;font-weight:600}
.tr .v{font-size:16px;font-weight:800;color:var(--orange)}
.bal{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.bal .n{flex:1;font-weight:600;font-size:14px}
.bal .v{font-weight:800;font-size:14.5px}
.bal .v.pos{color:var(--ok)} .bal .v.neg{color:var(--danger)}
.barmini{height:5px;border-radius:3px;background:var(--line);flex:0 0 70px;position:relative;overflow:hidden}
.barmini i{position:absolute;top:0;bottom:0;background:var(--ok)}
.barmini i.neg{background:var(--danger)}

/* gráfico */
.chart{width:100%;height:104px;display:block;margin-top:4px}
.lg{display:flex;gap:14px;font-size:10.5px;color:var(--dim);font-weight:700;margin-top:6px;flex-wrap:wrap}
.chartwrap{position:relative}
.chartwrap svg{height:190px}
.chart-tip{transition:opacity .12s,left .1s ease}
.chart-tip{position:absolute;top:6px;pointer-events:none;background:var(--panel);border:1px solid var(--line2);
 border-radius:11px;padding:8px 10px;box-shadow:var(--shadowlg);font-size:11.5px;min-width:132px;transition:opacity .12s;z-index:5}
.chart-tip .tt-h{font-weight:800;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.chart-tip .tt-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0}
.chart-tip .tt-r span{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}
.chart-tip .tt-r i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chart-tip .tt-r b{color:var(--text);font-weight:700}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* login */
.login{padding:calc(34px + env(safe-area-inset-top)) 20px 34px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto}
.login .disp{font-size:40px;text-align:center;margin:8px 0 4px}
.login .ll{color:var(--muted);text-align:center;font-size:13.5px;margin:14px 0 16px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.pbtn{background:var(--panel);border:1px solid var(--line2);color:var(--navy);border-radius:13px;
 padding:15px 10px;font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit}
.pbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pininp{display:flex;justify-content:center;margin:0 0 14px}
.pininp input{max-width:250px;height:54px;text-align:center;font-size:19px;letter-spacing:.14em;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);
 background:var(--navy);color:#fff;font-weight:800;padding:11px 18px;border-radius:12px;font-size:13.5px;
 box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:99;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-5px)}
.toast.comacao{display:flex;align-items:center;gap:12px;pointer-events:auto;text-align:left;padding:9px 9px 9px 16px}
.toast .undo{background:var(--orange);color:#fff;border:none;border-radius:9px;padding:8px 14px;
 font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;flex:0 0 auto}
.toast .undo:active{transform:scale(.94)}

.modal{position:fixed;inset:0;z-index:80;background:rgba(18,29,50,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--bg);border:1px solid var(--line2);border-top-left-radius:20px;border-top-right-radius:20px;
 width:100%;max-width:520px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.modal .box h3{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:19px;margin-bottom:12px}
.pf{width:100%;margin-bottom:8px;text-align:center;justify-content:center}
.adm-scroll{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:10px}
.btn,.chip,.seg div,.pbtn,.iconbtn,.nav div,.tick,.x{transition:transform .08s ease, background .15s ease, border-color .15s ease, color .15s ease}
.btn:active,.pbtn:active{transform:scale(.975)}
.iconbtn:active,.tick:active{transform:scale(.9)}
.li{transition:transform .1s ease}
.card,.li,.tr,.hero{animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{animation:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.9s cubic-bezier(.3,.6,.5,1) forwards}
#ptr{position:fixed;top:-4px;left:50%;margin-left:-18px;width:36px;height:36px;border-radius:50%;
 background:var(--panel);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
 z-index:60;opacity:0;transition:opacity .2s ease;pointer-events:none}
.sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 37%,var(--panel2) 63%);background-size:400% 100%;
 animation:shimmer 1.3s ease infinite;border-radius:8px;margin-bottom:10px}
.sk-lg{height:34px;width:55%}.sk-md{height:16px;width:75%}.sk-sm{height:14px;width:100%}
.sk-row{display:flex;gap:10px}.sk-kpi{height:52px;flex:1}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
#ptr .ptrspin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--orange);transition:transform .2s}
#ptr.ready .ptrspin{border-top-color:var(--ok)}
#ptr.spin .ptrspin{animation:ptrsp .7s linear infinite}
@keyframes ptrsp{to{transform:rotate(360deg)}}
@keyframes fall{to{top:105%;opacity:.2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--mun);outline-offset:2px}
/* ============ DESKTOP (>= 900px) ============ */
@media (min-width:900px){
  body{max-width:none;padding:0 0 0 250px}
  body::before{height:0;background:none}
  /* barra inferior vira sidebar fixa à esquerda */
  .fab{right:28px;bottom:28px;width:58px;height:58px}
  .nav{position:fixed;top:0;left:0;bottom:0;right:auto;width:250px;height:100vh;
    flex-direction:column;align-items:stretch;justify-content:flex-start;
    border-top:none;border-right:1px solid var(--line);padding:22px 14px;gap:5px;
    backdrop-filter:none;background:var(--panel);max-width:none;margin:0;overflow-y:auto}

  .strip{padding:20px 24px}
  .strip h1{font-size:34px}
  .card{padding:18px}

  .cofre-top>.hero{margin-bottom:0}
  .cofre-top .cofre-month{display:flex;flex-direction:column}
  .cofre-top .cofre-month .card{margin-bottom:0;flex:1}
  .cofre-top .sect{margin-top:0}
  .chartwrap svg{height:270px}
  /* A família (esquerda) + gráfico (direita) lado a lado */
  .cofre-fam{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;align-items:stretch;margin-top:22px}
  .cofre-mais .cofre-fam{margin-top:14px}
  .cofre-fam .dcol{display:flex;flex-direction:column;min-width:0}
  .cofre-fam .dcol .card{flex:1;display:flex;flex-direction:column;justify-content:center}
  .cofre-fam .chartwrap{flex:1;display:flex;flex-direction:column;justify-content:center}

  .seg{max-width:100%}
  .tb{font-size:14.5px}
  .li{padding:13px 15px}
  /* grades de 2 colunas para blocos densos (custos/racha) */
  .dtwo{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .dcol{display:flex;flex-direction:column}
  /* (2) roteiro em coluna única (mais senso de continuidade na linha do tempo) */
  .daygrid{column-count:1}

  /* Início: hero largo + cartões-resumo em duas colunas */
  #p-inicio{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  #p-inicio .ini-hero{grid-column:1 / -1;margin-bottom:0;padding:24px 26px}
  #p-inicio .ini-hero-n{font-size:56px}
  #p-inicio .ini-card{margin-bottom:0}

  .nav .navsum-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:700;padding:0}
  .nav .navsum-row b{color:var(--navy);font-size:13px}
  .nav .navsum-bar{height:7px;padding:0;border:0;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px;flex:0 0 auto;position:relative;display:block;box-sizing:border-box}
  .nav .navsum-bar i{position:absolute;left:0;top:0;bottom:0;display:block;height:7px;min-width:7px;background:var(--orange);border-radius:99px;transition:width .5s}
  .nav{display:flex}

  @keyframes slideIn{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}

.hint::before{content:"";position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);

.hint:hover::after,.hint:focus::after{opacity:1;transform:translateX(-50%) translateY(0)}
.hint:hover::before,.hint:focus::before{opacity:1}

/* verificação de senha: PBKDF2-SHA256 quando há hash, texto puro como último recurso */
async function pbkdf2(pass,saltHex,iter){
  const enc=new TextEncoder();
  const salt=new Uint8Array((saltHex.match(/../g)||[]).map(h=>parseInt(h,16)));
  const k=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},k,256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function conferir(rec,valor,fallback){
  if(!rec)return fallback!=null&&fallback===valor;
  if(!(window.crypto&&crypto.subtle))return false;
  const p=String(rec).split("$");
  if(p.length!==4||p[0]!=="pbkdf2")return false;
  try{return (await pbkdf2(valor,p[2],Number(p[1])))===p[3];}catch(e){return false;}
}
const checarPessoa=(n,v)=>conferir(PIN_HASH[n],v,PINS[n]);

function partesTZ(tz){
  try{
    const f=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
    const q={};f.formatToParts(new Date()).forEach(x=>{if(x.type!=="literal")q[x.type]=x.value;});
    if(q.hour==="24")q.hour="00";
    return q;
  }catch(e){
    const d=new Date(),z=n=>String(n).padStart(2,"0");
    return {year:String(d.getFullYear()),month:z(d.getMonth()+1),day:z(d.getDate()),hour:z(d.getHours()),minute:z(d.getMinutes())};

/* ---- exportar o roteiro pro calendário (.ics) — offline, sem servidor ----
   Converte o horário local do destino para UTC (usando o fuso da viagem),
   assim o evento cai na hora certa em qualquer aparelho. */
function tzOffsetMin(tz,date){
  try{
    const dtf=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
    const q={};dtf.formatToParts(date).forEach(x=>{if(x.type!=="literal")q[x.type]=x.value;});
    const asUTC=Date.UTC(+q.year,+q.month-1,+q.day,+q.hour,+q.minute,+q.second);
    return Math.round((asUTC-date.getTime())/60000);
  }catch(e){return 0;}
}
function wallToUTC(Y,Mo,Da,h,mi,tz){
  const guess=Date.UTC(Y,Mo-1,Da,h,mi,0);
  const off=tzOffsetMin(tz,new Date(guess));
  return new Date(guess-off*60000);
}

      let ev=["BEGIN:VEVENT","UID:"+((a.id||("d"+n))+"@resenhatrip")+"","DTSTAMP:"+now,"SUMMARY:"+icsEsc(a.titulo||"Passeio")];
      if(/^\d{1,2}:\d{2}$/.test(a.hora||"")){

      ev.push("END:VEVENT"); out=out.concat(ev); n++;
    });
  });
  out.push("END:VCALENDAR");
  if(!n){toast("Roteiro vazio");return;}
  try{

const CAT_COR={
  "Passagens":"#E8722E","Hospedagem":"#1B3A6B","Transporte":"#3E82C4",
  "Passeios":"#1E9E74","Alimentação":"#C6552B","Compras":"#8A6FB0",

function catColor(cat){
  if(CAT_COR[cat])return CAT_COR[cat];
  let h=0;const s=String(cat||"");for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  const hue=h%360, hue2=(hue<45||hue>320)?(hue+90)%360:hue; // evita vermelho puro (reservado a erro)
  return `hsl(${hue2} 42% 52%)`;
}

async function initFB(){
  try{
    let A,F,U;
    try{
      A=await import(`https://www.gstatic.com/firebasejs/${SVER}/firebase-app.js`);
      F=await import(`https://www.gstatic.com/firebasejs/${SVER}/firebase-firestore.js`);
      if(USE_ANON_AUTH)U=await import(`https://www.gstatic.com/firebasejs/${SVER}/firebase-auth.js`);
    }catch(e){e.code="SDK_LOAD_FAIL";throw e;}
    FB=F;const app=A.initializeApp(firebaseConfig);
    if(APPCHECK_KEY){
      try{
        const AC=await import(`https://www.gstatic.com/firebasejs/${SVER}/firebase-app-check.js`);
        const ac=AC.initializeAppCheck(app,{provider:new AC.ReCaptchaV3Provider(APPCHECK_KEY),isTokenAutoRefreshEnabled:true});
        const tk=await AC.getToken(ac,false);
        APPCHECK_ST=(tk&&tk.token)?"OK — token emitido":"sem token (motivo desconhecido)";
      }catch(err){
        APPCHECK_ST="FALHOU — "+String((err&&err.message)||err).slice(0,120);
        console.warn("App Check:",err);
      }
    }else{APPCHECK_ST="desligado (APPCHECK_KEY vazio no config.js)";}
    if(USE_ANON_AUTH){
      const auth=U.getAuth(app);
      // espera o SDK restaurar a sessão guardada no aparelho
      await new Promise(res=>{const un=U.onAuthStateChanged(auth,()=>{un();res();});});
      if(!auth.currentUser){
        try{await U.signInAnonymously(auth);}
        catch(e){
          // sem rede: segue com o cache local do Firestore em vez de cair no modo local
          if(navigator.onLine){e.code=e.code||"AUTH_FAIL";throw e;}
          console.warn("Offline no login anônimo — seguindo com o cache local.");
        }
      }
    }
    /* Persistência offline: leituras e ESCRITAS continuam funcionando sem rede.
       O que for lançado offline fica numa fila local e sobe sozinho ao reconectar. */
    try{
      if(F.persistentLocalCache&&F.initializeFirestore){
        db=F.initializeFirestore(app,{
          localCache:F.persistentLocalCache(
            F.persistentMultipleTabManager?{tabManager:F.persistentMultipleTabManager()}:{})
        });
        PERSIST_OK=true;
      }else{
        db=F.getFirestore(app);
        if(F.enableIndexedDbPersistence){ // API antiga
          try{await F.enableIndexedDbPersistence(db);PERSIST_OK=true;}catch(e2){console.warn("IndexedDB:",e2&&e2.code);}
        }
      }
    }catch(e){
      console.warn("Persistência offline indisponível, seguindo sem ela:",e);
      try{db=F.getFirestore(app);}catch(e3){}
      PERSIST_OK=false;
    }
    if(!db)db=F.getFirestore(app);
    await ensureSeed();listen();
  }catch(e){
    console.warn("Firestore indisponível — modo local:",e);
    MOCK=true;loadLocal();
    const ob=$("#offbar");
    if(ob){ob.classList.remove("hidden");
      const cod=String((e&&e.code)||(e&&e.name)||"?");
      const dica=!CFG_OK?"O arquivo config.js não foi encontrado ou está sem a apiKey. Confira se ele está no repositório, ao lado do index.html.":
        (/api-key-not-valid/i.test(cod)?"A apiKey do config.js está errada. Copie de novo em Firebase → ⚙ → Configurações do projeto → Seus apps.":
        (/auth\/(admin-restricted|operation-not-allowed|configuration)/.test(cod)?"Ligue o login anônimo em Authentication → Método de login.":
        (/permission|insufficient/i.test(cod+String(e&&e.message))?"Confira as regras do Firestore.":"")));
      ob.innerHTML="⚠️ <b>Sem conexão com o banco.</b> O app está salvando só neste aparelho.<br>"+
        (dica?"<b>"+esc(dica)+"</b><br>":"")+
        "<span style='font-size:11px'>Erro: "+esc(cod)+" — "+esc(String((e&&e.message)||e).slice(0,140))+"</span>";}
    renderAll();
  }
}
async function ensureSeed(){
  const sref=FB.doc(db,NS.viagem,"seeded");
  let snap;
  try{snap=await FB.getDoc(sref);}
  catch(e){
    // offline e sem cache dessa leitura: não semear nada e seguir para os listeners,
    // que servem o que já estiver guardado no aparelho
    console.warn("Sem leitura do 'seeded' (provavelmente offline) — seguindo:",e&&e.code);
    return;
  }
  if(snap.exists())return;
  const b=FB.writeBatch(db);
  b.set(FB.doc(db,NS.viagem,"config"),SEED.config);
  b.set(FB.doc(db,NS.viagem,"roteiro"),SEED.roteiro);
  b.set(FB.doc(db,NS.viagem,"custos"),SEED.custos);
  b.set(FB.doc(db,NS.viagem,"racha"),SEED.racha);
  PEOPLE.forEach(p=>b.set(FB.doc(db,NS.pessoas,p),{meta:0,depositos:[],compras:[],checklist:[],pessoais:[],realizados:[],mala:[]}));
  b.set(sref,{done:true,at:Date.now()});
  await b.commit();
}
/* ---- estado de sincronização -------------------------------------
   Com a persistência ligada, o que é lançado offline fica numa fila local.
   Esta faixa deixa isso visível: "sincronizando" enquanto há coisa na fila. */
const _pend=new Set();
function atualizarSync(){
  const el=$("#syncbar");if(!el)return;
  if(MOCK){el.className="hidden";el.textContent="";return;} // o offbar amarelo já explica
  const offline=!navigator.onLine;
  const pendentes=_pend.size>0;
  if(!offline&&!pendentes){el.className="hidden";el.textContent="";return;}
  el.className=offline?"off":"pend";
  el.innerHTML='<span class="dot"></span><span>'+(offline
    ? "Sem internet — o que você lançar fica salvo e sobe sozinho quando a conexão voltar."
    : "Sincronizando alterações…")+"</span>";
}
function marcarPend(chave,meta){
  if(meta&&meta.hasPendingWrites)_pend.add(chave);else _pend.delete(chave);
  atualizarSync();
}
window.addEventListener("online",atualizarSync);
window.addEventListener("offline",atualizarSync);

function listen(){
  const opts={includeMetadataChanges:true};
  const doc1=(id,key,fb)=>FB.onSnapshot(FB.doc(db,NS.viagem,id),opts,d=>{
    STATE[key]=d.exists()?Object.assign({},fb,d.data()):JSON.parse(JSON.stringify(fb));
    marcarPend("v:"+id,d.metadata);renderAll();});
  doc1("config","config",SEED.config);
  doc1("roteiro","roteiro",SEED.roteiro);
  doc1("custos","custos",SEED.custos);
  doc1("racha","racha",SEED.racha);
  doc1("reservas","reservas",SEED.reservas);
  doc1("tarefas","tarefas",SEED.tarefas);
  doc1("essenciais","essenciais",SEED.essenciais);
  FB.onSnapshot(FB.collection(db,NS.pessoas),opts,s=>{
    PEOPLE.forEach(p=>{if(!STATE.pessoas[p])STATE.pessoas[p]={meta:0,depositos:[],compras:[],checklist:[],pessoais:[],realizados:[],mala:[]};});
    s.forEach(d=>{const v=d.data()||{};STATE.pessoas[d.id]={meta:Number(v.meta)||0,verba:Number(v.verba)||0,depositos:v.depositos||[],compras:v.compras||[],checklist:v.checklist||[],pessoais:v.pessoais||[],realizados:v.realizados||[],mala:v.mala||[],malaTpls:v.malaTpls||[]};});
    marcarPend("pessoas",s.metadata);renderAll();});
  atualizarSync();
}

/* ---- escritas atômicas em arrays compartilhados -------------------
   Reescrever o array inteiro faz o último a salvar apagar o lançamento
   do outro (dois na mesma mesa lançando ao mesmo tempo). arrayUnion e
   arrayRemove são aplicados pelo servidor item a item, sem se atropelar. */
async function addArr(id,campo,itens){
  const lista=Array.isArray(itens)?itens:[itens];
  STATE[id]=Object.assign({},STATE[id],{[campo]:((STATE[id]||{})[campo]||[]).concat(lista)});
  renderAll();
  if(MOCK){saveLocal();return;}
  try{await FB.setDoc(FB.doc(db,NS.viagem,id),{[campo]:FB.arrayUnion.apply(null,lista)},{merge:true});}
  catch(e){console.error(e);toast("Erro ao salvar: "+String((e&&e.code)||(e&&e.message)||e).slice(0,60));}
}
async function delArr(id,campo,itens){
  const lista=Array.isArray(itens)?itens:[itens];
  const ids=new Set(lista.map(x=>x&&x.id));
  STATE[id]=Object.assign({},STATE[id],{[campo]:((STATE[id]||{})[campo]||[]).filter(x=>!ids.has(x.id))});
  renderAll();
  if(MOCK){saveLocal();return;}
  try{await FB.setDoc(FB.doc(db,NS.viagem,id),{[campo]:FB.arrayRemove.apply(null,lista)},{merge:true});}
  catch(e){console.error(e);toast("Erro ao excluir: "+String((e&&e.code)||(e&&e.message)||e).slice(0,60));}
}

/* (6/3) anima os números financeiros do painel ativo para "contar" até o valor.
   Detecta automaticamente os displays de dinheiro grandes e conta de 0 até o valor,
   preservando exatamente o texto final formatado. */
function animarNumeros(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const panel=document.querySelector(".panel-v.on");if(!panel)return;
  // seletor dos displays financeiros com destaque (não anima tabelas/linhas pequenas)
  const alvos=panel.querySelectorAll(".disp.money, .big.money, .hero .pct, .kpi .v.money");
  alvos.forEach(el=>{
    if(el._anim)return;
    const txtFinal=el.textContent;
    // extrai o número do texto (aceita R$ 1.234,56 / US$ 1.234 / € 900 / 25%)
    const m=txtFinal.replace(/\u00a0/g," ").match(/-?[\d.]+(?:,\d+)?/);
    if(!m)return;
    const num=parseFloat(m[0].replace(/\./g,"").replace(",","."));
    if(isNaN(num)||Math.abs(num)<1)return; // não anima 0 ou vazio
    // reconstrói o texto substituindo só a parte numérica, pra manter prefixo/sufixo (R$, %, etc.)
    const casas=(m[0].indexOf(",")>=0)?(m[0].length-m[0].indexOf(",")-1):0;
    const fmtN=v=>txtFinal.replace(m[0],new Intl.NumberFormat("pt-BR",{minimumFractionDigits:casas,maximumFractionDigits:casas}).format(v));
    el._anim=true;
    const dur=560,t0=performance.now();
    function step(t){const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);
      el.textContent=fmtN(num*e);
      if(p<1)requestAnimationFrame(step);else{el.textContent=txtFinal;el._anim=false;}}
    requestAnimationFrame(step);
  });
}

/* ---- 8. CÁLCULOS COMPARTILHADOS ------------------------ */
function itemPeople(it){
  if(!it)return[];
  if(it.quem==="todos"||!Array.isArray(it.quem))return PEOPLE.slice();
  const g=it.quem.filter(p=>PEOPLE.includes(p));
  return g.length?g:PEOPLE.slice();
}
const naMeta=it=>it&&it.naMeta===false?false:true;
/* passeios do roteiro que têm preço viram itens de orçamento automaticamente */
function roteiroItens(){
  const out=[];
  (STATE.roteiro.dias||[]).forEach(d=>(d.itens||[]).forEach(a=>{
    if(Number(a.valor)>0)out.push({id:d.id+"~"+a.id,cat:"Passeios do roteiro",
      desc:a.titulo,valor:Number(a.valor),moeda:a.moeda||"EUR",
      quem:(Array.isArray(a.quem)&&a.quem.length)?a.quem:"todos",naMeta:true});
  }));
  return out;
}
const custoItens=()=>(STATE.custos.itens||[]).concat(roteiroItens());
function shareShared(p,todos){
  let s=0;custoItens().forEach(it=>{
    if(!todos&&!naMeta(it))return;
    const g=itemPeople(it);if(g.includes(p))s+=toBRL(it.valor,it.moeda)/g.length;});
  return s;
}
/* plano = tudo. orçamento/meta = tudo menos o que está fora da meta (passagens) */
const planoDe=p=>shareShared(p,true)+personalTotal(p);
const foraDaMeta=p=>shareShared(p,true)-shareShared(p,false);
const itensPessoais=p=>((STATE.pessoas[p]||{}).pessoais||[]).map(x=>Object.assign({de:"Custos"},x))
  .concat(((STATE.pessoas[p]||{}).compras||[]).filter(x=>Number(x.valor)>0).map(x=>({id:x.id,desc:x.item,valor:x.valor,moeda:x.moeda,de:"Compras"})));
const personalTotal=p=>itensPessoais(p).reduce((a,i)=>a+toBRL(i.valor,i.moeda),0);
const orcamentoDe=p=>shareShared(p)+personalTotal(p);
const totalShared=()=>custoItens().reduce((a,it)=>a+toBRL(it.valor,it.moeda),0);
const totalMeta=()=>custoItens().filter(naMeta).reduce((a,it)=>a+toBRL(it.valor,it.moeda),0);
const guardado=p=>((STATE.pessoas[p]||{}).depositos||[]).reduce((a,d)=>a+toBRL(d.valor,d.moeda||"BRL"),0);
function metaDe(p){const m=Number((STATE.pessoas[p]||{}).meta)||0;return m>0?m:orcamentoDe(p);}
const metaAuto=p=>!(Number((STATE.pessoas[p]||{}).meta)>0);

const RENDERS={inicio:()=>renderInicio(),cofre:()=>renderCofre(),custos:()=>renderCustos(),roteiro:()=>renderRoteiro(),
  compras:()=>renderCompras(),check:()=>renderCheck(),racha:()=>renderRacha(),reservas:()=>renderReservas(),admin:()=>renderAdmin()};

}

/* ---- Divisor de conta de restaurante --------------------
   Itens (valor + quem consumiu, dividido igualmente entre eles);
   gorjeta e imposto (valor OU %) rateados na proporção do que cada
   um consumiu; um ou mais pagadores com o quanto cada um pôs; no fim,
   vira despesa(s) no racha (uma por pagador, cada devedor sozinho no
   rateio para expressar o valor exato que deve).                     */
let _restState=null;
function abrirRestaurante(){
  const cur=MOEDA_VIAGEM();
  if(!_restState)_restState={
    itens:[{id:uid(),nome:"",valor:"",quem:[]}],
    gorjTipo:"valor",gorjVal:"",  impTipo:"valor",impVal:"",
    pagadores:{} // nome -> quanto colocou (string)
  };
  const S=_restState;
  const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:cur,maximumFractionDigits:2}).format(v||0);

  // ---- cálculos ----
  function calc(){
    const consumo={};PEOPLE.forEach(p=>consumo[p]=0);
    let subtotal=0;
    S.itens.forEach(it=>{
      const v=parseMoney(it.valor)||0;if(v<=0||!it.quem.length)return;
      subtotal+=v;const each=v/it.quem.length;
      it.quem.forEach(p=>{if(consumo[p]!=null)consumo[p]+=each;});
    });
    const gorj=S.gorjTipo==="pct"?subtotal*((parseMoney(S.gorjVal)||0)/100):(parseMoney(S.gorjVal)||0);
    const imp =S.impTipo==="pct" ?subtotal*((parseMoney(S.impVal )||0)/100):(parseMoney(S.impVal )||0);
    const extra=gorj+imp;
    // rateia extra na proporção do consumo
    const total={};PEOPLE.forEach(p=>{
      const share=subtotal>0?consumo[p]/subtotal:0;
      total[p]=consumo[p]+extra*share;
    });
    const grand=subtotal+extra;
    return {consumo,subtotal,gorj,imp,extra,total,grand};
  }

  function render(){
    const R=calc();
    const consumidores=PEOPLE.filter(p=>R.total[p]>0.005);
    const pagPostos=Object.keys(S.pagadores).filter(p=>parseMoney(S.pagadores[p])>0);
    const somaPag=pagPostos.reduce((a,p)=>a+parseMoney(S.pagadores[p]),0);
    const difere=Math.abs(somaPag-R.grand)>0.02;

    $("#modal").innerHTML=`<div class="modal"><div class="box rest-box"><h3>Dividir conta de restaurante</h3>
      <div class="rest-sec">Itens</div>
      <div id="rst-itens">${S.itens.map(it=>`<div class="rst-item" data-it="${it.id}">
        <div class="rst-item-top">
          <input class="rst-nome" data-f="nome" placeholder="Item (ex.: Pizza)" value="${esc(it.nome)}">
          <input class="rst-val" data-f="valor" inputmode="decimal" placeholder="0,00" value="${esc(it.valor)}">
          <button class="x rst-del" aria-label="Remover">✕</button>
        </div>
        <div class="rst-quem">${PEOPLE.map(p=>`<span class="rst-chip ${it.quem.includes(p)?"on":""}" data-p="${esc(p)}">${esc(p)}</span>`).join("")}</div>
      </div>`).join("")}</div>
      <button class="btn gh sm" id="rst-add" style="margin:2px 0 12px">+ Item</button>

      <div class="rest-sec">Gorjeta e imposto</div>
      <div class="f2" style="margin-bottom:8px">
        <div><label class="f">Gorjeta</label>
          <div class="rst-inrow"><input id="rst-gv" inputmode="decimal" placeholder="0" value="${esc(S.gorjVal)}">
            <button class="rst-unit" id="rst-gt">${S.gorjTipo==="pct"?"%":cur}</button></div></div>
        <div><label class="f">Imposto</label>
          <div class="rst-inrow"><input id="rst-iv" inputmode="decimal" placeholder="0" value="${esc(S.impVal)}">
            <button class="rst-unit" id="rst-it">${S.impTipo==="pct"?"%":cur}</button></div></div>
      </div>

      <div class="rest-sec">Quanto cada um deve<span class="rest-grand">${money(R.grand)}</span></div>
      <div id="rst-totwrap">${consumidores.length?`<div class="rst-tot">${consumidores.map(p=>`<div class="rst-totrow">
        <span>${esc(p)}</span>
        <b>${money(R.total[p])}</b></div>`).join("")}
        <div class="rst-totrow rst-sub"><span>Subtotal ${money(R.subtotal)} · gorjeta ${money(R.gorj)} · imposto ${money(R.imp)}</span></div>
        </div>`:`<div class="note">Adicione itens e marque quem consumiu cada um.</div>`}</div>

      <div class="rest-sec">Quem pagou?</div>
      <div class="rst-pags">${PEOPLE.map(p=>{
        const on=S.pagadores[p]!=null;
        const isTotal=on&&Math.abs((parseMoney(S.pagadores[p])||-1)-R.grand)<0.005&&R.grand>0;
        return `<div class="rst-pagrow ${on?"on":""}">
          <span class="rst-chip ${on?"on":""}" data-pag="${esc(p)}">${esc(p)}</span>
          ${on?`<input class="rst-pagval" data-pagv="${esc(p)}" inputmode="decimal" placeholder="quanto pôs" value="${esc(S.pagadores[p]||"")}">
          <label class="rst-totchk"><input type="checkbox" data-pagtot="${esc(p)}" ${isTotal?"checked":""}>Total</label>`:""}</div>`;}).join("")}</div>
      ${pagPostos.length?`<div class="note" id="rst-pagnota" style="margin-top:6px">Pagadores somam ${money(somaPag)} de ${money(R.grand)}${difere?` <b style="color:var(--danger)">— confira, não fecha com o total</b>`:" ✓"}</div>`:`<div class="note" id="rst-pagnota" style="margin-top:6px">Marque quem pagou e quanto cada um colocou.</div>`}

      <div class="rst-actions">
        <button class="btn gh" id="rst-close">Fechar</button>
        <button class="btn" id="rst-add-racha" ${(!consumidores.length||!pagPostos.length||difere)?"disabled":""}>Adicionar ao racha</button>
      </div>
      <div class="note">Cria uma despesa no racha por pagador, com o valor exato que cada pessoa deve. Nada é salvo até você clicar em "Adicionar ao racha".</div>
    </div></div>`;
    wire(R,consumidores,pagPostos,somaPag,difere);
  }

  function wire(R,consumidores,pagPostos,somaPag,difere){
    // itens: nome/valor
    $("#modal").querySelectorAll(".rst-item").forEach(row=>{
      const id=row.dataset.it, it=S.itens.find(x=>x.id===id);if(!it)return;
      row.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{it[inp.dataset.f]=inp.value;/* recalc leve */liveTotals();});
      row.querySelector(".rst-del").onclick=()=>{S.itens=S.itens.filter(x=>x.id!==id);if(!S.itens.length)S.itens=[{id:uid(),nome:"",valor:"",quem:[]}];render();};
      row.querySelectorAll(".rst-chip[data-p]").forEach(ch=>ch.onclick=()=>{
        const p=ch.dataset.p;
        it.quem=it.quem.includes(p)?it.quem.filter(x=>x!==p):it.quem.concat([p]);
        ch.classList.toggle("on",it.quem.includes(p)); // toggle visual sem re-render (evita piscada)
        liveTotals();});
    });
    $("#rst-add").onclick=()=>{S.itens.push({id:uid(),nome:"",valor:"",quem:[]});render();};
    // gorjeta/imposto valores + unidade
    const gv=$("#rst-gv");if(gv)gv.oninput=()=>{S.gorjVal=gv.value;liveTotals();};
    const iv=$("#rst-iv");if(iv)iv.oninput=()=>{S.impVal=iv.value;liveTotals();};
    $("#rst-gt").onclick=()=>{S.gorjTipo=S.gorjTipo==="pct"?"valor":"pct";render();};
    $("#rst-it").onclick=()=>{S.impTipo=S.impTipo==="pct"?"valor":"pct";render();};
    // pagadores: marcar/desmarcar e valor
    $("#modal").querySelectorAll(".rst-chip[data-pag]").forEach(ch=>ch.onclick=()=>{
      const p=ch.dataset.pag;
      if(S.pagadores[p]!=null)delete S.pagadores[p];else S.pagadores[p]="";
      render();});
    $("#modal").querySelectorAll("[data-pagv]").forEach(inp=>inp.oninput=()=>{S.pagadores[inp.dataset.pagv]=inp.value;
      // digitar manualmente desmarca o "Total" se não bater mais
      const chk=$("#modal").querySelector(`[data-pagtot="${inp.dataset.pagv.replace(/"/g,'\\"')}"]`);
      if(chk){const R3=calc();chk.checked=Math.abs((parseMoney(inp.value)||-1)-R3.grand)<0.005&&R3.grand>0;}
      liveTotals();});
    // checkbox "Total": preenche o valor do pagador com o total da conta
    $("#modal").querySelectorAll("[data-pagtot]").forEach(chk=>chk.onchange=()=>{
      const p=chk.dataset.pagtot;const R3=calc();
      S.pagadores[p]=chk.checked?String(R3.grand.toFixed(2)).replace(".",","):"";
      const inp=$("#modal").querySelector(`[data-pagv="${p.replace(/"/g,'\\"')}"]`);
      if(inp)inp.value=S.pagadores[p];
      liveTotals();});
    // recálculo leve dos totais sem re-render (mantém foco nos inputs)
    function liveTotals(){
      const R2=calc();
      const cons=PEOPLE.filter(p=>R2.total[p]>0.005);
      const wrap=$("#modal").querySelector("#rst-totwrap");
      const grandEl=$("#modal").querySelector(".rest-grand");
      if(grandEl)grandEl.textContent=money(R2.grand);
      if(wrap)wrap.innerHTML=cons.length?`<div class="rst-tot">${cons.map(p=>`<div class="rst-totrow"><span>${esc(p)}</span><b>${money(R2.total[p])}</b></div>`).join("")}`+
        `<div class="rst-totrow rst-sub"><span>Subtotal ${money(R2.subtotal)} · gorjeta ${money(R2.gorj)} · imposto ${money(R2.imp)}</span></div></div>`:
        `<div class="note">Adicione itens e marque quem consumiu cada um.</div>`;
      // atualiza aviso de pagadores + estado do botão
      const pag2=Object.keys(S.pagadores).filter(p=>parseMoney(S.pagadores[p])>0);
      const soma2=pag2.reduce((a,p)=>a+parseMoney(S.pagadores[p]),0);
      const dif2=Math.abs(soma2-R2.grand)>0.02;
      const nota=$("#modal").querySelector("#rst-pagnota");
      if(nota)nota.innerHTML=pag2.length?`Pagadores somam ${money(soma2)} de ${money(R2.grand)}${dif2?` <b style="color:var(--danger)">— confira, não fecha com o total</b>`:" ✓"}`:`Marque quem pagou e quanto cada um colocou.`;
      const add2=$("#modal").querySelector("#rst-add-racha");
      if(add2)add2.disabled=(!cons.length||!pag2.length||dif2);
    }
    const close=()=>{$("#modal").innerHTML="";};
    $("#rst-close").onclick=()=>{_restState=null;close();};
    $("#modal").querySelector(".modal").onclick=e=>{if(e.target===e.currentTarget){/* não fecha à toa: pode perder dados */}};
    const add=$("#rst-add-racha");
    if(add)add.onclick=()=>{if(!add.disabled)adicionarAoRacha();};
  }

  // ---- gera as despesas no racha ----
  function adicionarAoRacha(){
    const R=calc();
    const consumidores=PEOPLE.filter(p=>R.total[p]>0.005);
    const pagPostos=Object.keys(S.pagadores).filter(p=>parseMoney(S.pagadores[p])>0);
    const somaPag=pagPostos.reduce((a,p)=>a+parseMoney(S.pagadores[p]),0);
    if(!consumidores.length||!pagPostos.length||Math.abs(somaPag-R.grand)>0.02){
      toast("Confira itens e pagadores antes de adicionar");return;}
    const cur=MOEDA_VIAGEM();
    // quanto cada consumidor deve no total (consumo + rateio de gorjeta/imposto)
    const deve={};consumidores.forEach(p=>deve[p]=R.total[p]);
    // quanto cada pagador colocou
    const posto={};pagPostos.forEach(p=>posto[p]=parseMoney(S.pagadores[p]));
    // 1) cada pagador quita a própria parte primeiro (não vira dívida de ninguém)
    pagPostos.forEach(p=>{if(deve[p]!=null){const usa=Math.min(posto[p],deve[p]);posto[p]-=usa;deve[p]-=usa;}});
    // 2) crédito restante de cada pagador (o que pôs além da própria conta)
    const credTot=pagPostos.reduce((a,p)=>a+Math.max(0,posto[p]),0);
    const devedores=Object.keys(deve).filter(d=>deve[d]>0.005);
    // 3) distribui cada dívida entre os pagadores com crédito, proporcional ao crédito
    const despesas=[];const hoje=new Date().toISOString().slice(0,10);
    devedores.forEach(d=>{
      let restante=Math.round(deve[d]*100); // em centavos, pra fechar exato
      const comCred=pagPostos.filter(p=>posto[p]>0.005);
      comCred.forEach((p,idx)=>{
        if(restante<=0)return;
        const parcela=idx===comCred.length-1?restante:Math.min(restante,Math.round(deve[d]*100*(posto[p]/credTot)));
        if(parcela>0){
          despesas.push({id:uid(),desc:`Restaurante — ${d}`,valor:parcela/100,moeda:cur,pagou:p,entre:[d],data:hoje});
          restante-=parcela;
        }
      });
    });
    if(!despesas.length){toast("Sem dívidas a lançar (cada um pagou a própria parte)");_restState=null;$("#modal").innerHTML="";return;}
    vibrar(16);
    addArr("racha","despesas",despesas);
    _restState=null;$("#modal").innerHTML="";
    const n=despesas.length;
    toast(`${n} lançamento${n>1?"s":""} de restaurante no racha ✓`);
  }

  render();
}

/* ---- 10. COFRE (meta e poupança) ----------------------- */
function depMonths(p){
  const map={};((STATE.pessoas[p]||{}).depositos||[]).forEach(d=>{
    const k=d.mes||monthKey(new Date());map[k]=(map[k]||0)+toBRL(d.valor,d.moeda||"BRL");});
  return map;
}
/* alvo do mês corrente: o que faltava no dia 1 dividido pelos meses que sobram */
const iniPoup=()=>{const v=STATE.config.inicioPoupanca||"";return /^\d{4}-\d{2}$/.test(v)?v:"";};
/* meses que sobram para poupar, contando a partir do início do plano */
function mesesRestantes(){
  const t=ymd(STATE.config.inicio),n=new Date();
  let sy=n.getFullYear(),sm=n.getMonth();
  const ini=iniPoup();
  if(ini){const p=ini.split("-").map(Number);
    if(p[0]>sy||(p[0]===sy&&p[1]-1>sm)){sy=p[0];sm=p[1]-1;}}
  return Math.max(1,(t.getFullYear()-sy)*12+(t.getMonth()-sm));
}
const antesDoPlano=()=>{const i=iniPoup();return !!i&&monthKey(new Date())<i;};
function proxMes(mk){const[y,m]=mk.split("-").map(Number);const d=new Date(y,m,1);return monthKey(d);}
function mesInfo(p){
  const mk=monthKey(new Date()),mr=mesesRestantes(),antes=antesDoPlano();
  const total=guardado(p),noMes=(depMonths(p)[mk]||0);
  /* alvo do mês corrente: o que faltava no início do mês, dividido pelos meses restantes */
  const alvo=Math.max(0,(metaDe(p)-(total-noMes))/mr);
  const cumpriu=!antes&&noMes>=alvo-0.005;
  /* ritmo daqui pra frente: o que ainda falta guardado hoje, dividido pelos meses que sobram DEPOIS deste */
  const faltaTotal=Math.max(0,metaDe(p)-total);
  const mrDepois=Math.max(1,mr-1);
  const ritmoFuturo=faltaTotal>0?faltaTotal/mrDepois:0;
  return {mk:mk,alvo:alvo,guardado:noMes,falta:Math.max(0,alvo-noMes),antes:antes,
          ok:cumpriu,pct:alvo>0?clamp(noMes/alvo*100,0,100):100,meses:mr,
          ritmoFuturo:ritmoFuturo,proximo:proxMes(mk),faltaTotal:faltaTotal,acabou:faltaTotal<=0.005};
}
const CORPESSOA={};["#E8722E","#1B3A6B","#3E82C4","#1E9E74"].forEach((c,i)=>CORPESSOA[PEOPLE[i]]=c);
function grupoLinha(){
  // meses: do início do plano (ou 1º depósito) até o mês mais recente com depósito ou hoje
  const todosMeses=[];PEOPLE.forEach(p=>((STATE.pessoas[p]||{}).depositos||[]).forEach(dep=>{if(dep.mes)todosMeses.push(dep.mes);}));
  if(!todosMeses.length)return "";
  const ini=(iniPoup()&&iniPoup()<Math.min.apply(null,todosMeses.map(m=>m))?iniPoup():todosMeses.sort()[0]);
  const fimK=[monthKey(new Date())].concat(todosMeses).sort().pop();
  const meses=[];let d=ymd(ini+"-01");let g=0;
  while(monthKey(d)<=fimK&&g++<60){meses.push(monthKey(d));d.setMonth(d.getMonth()+1);}
  if(meses.length<2)return "";
  // acumulado por pessoa
  const acc={};PEOPLE.forEach(p=>{
    const bym={};((STATE.pessoas[p]||{}).depositos||[]).forEach(dep=>{
      const k=dep.mes||ini;bym[k]=(bym[k]||0)+toBRL(dep.valor,dep.moeda||"BRL");});
    let run=0;acc[p]=meses.map(k=>{run+=(bym[k]||0);return run;});
  });
  const maxV=Math.max(1,...PEOPLE.map(p=>acc[p][acc[p].length-1]));
  // dados para desenho e interação — o SVG é montado em wireChart, no tamanho real (sem distorção)
  const dados={meses:meses,people:PEOPLE,cor:PEOPLE.map(p=>CORPESSOA[p]),acc:PEOPLE.map(p=>acc[p]),cur:STATE.cur||"BRL",maxV:maxV,rate:{}};
  ["BRL","USD","EUR"].forEach(m=>dados.rate[m]=rate(m));
  const leg=PEOPLE.map(p=>`<span style="white-space:nowrap"><i style="background:${CORPESSOA[p]}"></i>${esc(p)}</span>`).join("");
  return `<div class="card"><div class="chartwrap">
    <svg id="glchart" style="width:100%;display:block;touch-action:pan-y"></svg>
    <div id="gltip" class="chart-tip" style="opacity:0"></div>
    <div class="glmeta" style="display:none">${esc(JSON.stringify(dados))}</div>
  </div>
    <div class="lg">${leg}</div></div>`;
}
/* desenha o gráfico no tamanho REAL do container (1 unidade svg = 1px → sem distorção)
   e liga a interação de hover/toque */
function wireChart(){
  const svg=document.getElementById("glchart");if(!svg||!svg.parentElement)return;
  const metaEl=svg.parentElement.querySelector&&svg.parentElement.querySelector(".glmeta");if(!metaEl)return;
  let D;try{D=JSON.parse(metaEl.textContent);}catch(e){return;}
  const tip=document.getElementById("gltip");
  const wrap=svg.parentElement;
  function draw(){
    const W=Math.round(wrap.clientWidth||320);
    // altura conforme viewport (desktop maior)
    const H=window.innerWidth>=900?270:180;
    const pl=12,pr=16,pt=18,pb=28,n=D.meses.length;
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
    svg.setAttribute("width",W);svg.setAttribute("height",H);
    svg.style.height=H+"px";
    svg.style.overflow="visible";
    const x=i=>pl+(i/(n-1))*(W-pl-pr);
    const y=v=>H-pb-(v/D.maxV)*(H-pt-pb);
    // grade horizontal em 4 níveis, com o valor de referência à esquerda
    const niveis=[0,.25,.5,.75,1];
    const grid=niveis.map(f=>{const yy=(pt+(H-pt-pb)*(1-f));
      return `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1" shape-rendering="crispEdges"/>`;}).join("");
    const linhas=D.people.map((p,pi)=>{
      const pts=D.acc[pi].map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      const last=D.acc[pi][D.acc[pi].length-1];
      return `<polyline points="${pts}" fill="none" stroke="${D.cor[pi]}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`+
             `<circle cx="${x(n-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3.4" fill="${D.cor[pi]}"/>`;
    }).join("");
    const step=Math.max(1,Math.ceil(n/(W>560?12:6)));
    const labs=D.meses.map((k,i)=>(i%step&&i!==n-1)?"":`<text x="${x(i).toFixed(1)}" y="${H-9}" fill="var(--dim)" font-size="10.5" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600">${monthLabel(k)}</text>`).join("");
    svg.innerHTML=`${grid}${labs}${linhas}
      <line id="glcursor" x1="0" y1="${pt}" x2="0" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="opacity:0"/>
      <g id="gldots"></g>`;
    svg._geo={W:W,H:H,pl:pl,pr:pr,pt:pt,pb:pb,x:x,y:y,n:n};
  }
  draw();
  const conv=(brl)=>{const r=D.rate[D.cur]||1;return D.cur==="BRL"?brl:brl/r;};
  const money=(brl)=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:D.cur||"BRL",maximumFractionDigits:0}).format(conv(brl));
  function show(clientX){
    const geo=svg._geo;if(!geo)return;
    const cur=document.getElementById("glcursor"),dots=document.getElementById("gldots");
    const box=svg.getBoundingClientRect();
    const rel=(clientX-box.left)/box.width;
    let i=Math.round(rel*(geo.n-1));i=Math.max(0,Math.min(geo.n-1,i));
    const px=geo.x(i);
    if(cur){cur.setAttribute("x1",px);cur.setAttribute("x2",px);cur.style.opacity="1";}
    if(dots)dots.innerHTML=D.people.map((p,pi)=>`<circle cx="${px.toFixed(1)}" cy="${geo.y(D.acc[pi][i]).toFixed(1)}" r="4.5" fill="${D.cor[pi]}" stroke="var(--panel)" stroke-width="2"/>`).join("");
    const linhas=D.people.map((p,pi)=>({p:p,c:D.cor[pi],v:D.acc[pi][i]})).sort((a,b)=>b.v-a.v);
    tip.innerHTML=`<div class="tt-h">${esc(monthLabel(D.meses[i]))}</div>`+
      linhas.map(l=>`<div class="tt-r"><span><i style="background:${l.c}"></i>${esc(l.p)}</span><b>${money(l.v)}</b></div>`).join("");
    // canto superior oposto ao cursor — nunca em cima dos pontos
    const wrapR=wrap.getBoundingClientRect();
    const relW=(clientX-wrapR.left)/wrapR.width; // 0..1 dentro do card
    const tw=tip.offsetWidth||140;
    let left = relW < 0.5 ? (wrapR.width-tw-6) : 6;
    left=Math.max(4,Math.min(wrapR.width-tw-4,left));
    tip.style.left=left+"px";tip.style.top="2px";tip.style.opacity="1";
  }
  function hide(){const cur=document.getElementById("glcursor"),dots=document.getElementById("gldots");
    if(cur)cur.style.opacity="0";if(dots)dots.innerHTML="";tip.style.opacity="0";}
  svg.addEventListener("mousemove",e=>show(e.clientX));
  svg.addEventListener("mouseleave",hide);
  let scrubX=0;
  svg.addEventListener("touchstart",e=>{if(e.touches[0]){scrubX=e.touches[0].clientX;show(e.touches[0].clientX);}},{passive:true});
  svg.addEventListener("touchmove",e=>{
    if(!e.touches[0])return;
    const dx=Math.abs(e.touches[0].clientX-scrubX);
    // se o dedo se move na horizontal sobre o gráfico, é para navegar o gráfico:
    // impede a rolagem/troca de aba da página
    if(dx>4&&e.cancelable)e.preventDefault();
    e.stopPropagation();
    show(e.touches[0].clientX);
  },{passive:false});
  svg.addEventListener("touchend",e=>{e.stopPropagation();hide();});
  // redesenha se a largura mudar (girar tela / redimensionar janela)
  if(window._glResize)window.removeEventListener("resize",window._glResize);
  window._glResize=()=>{if(document.getElementById("glchart")===svg)draw();};
  window.addEventListener("resize",window._glResize);
}

/* ---- 11b. INÍCIO (resumo simples da viagem) --------------------
   Reúne num só lugar, em linguagem simples e sem tabelas, o que cada
   pessoa precisa saber sem ter que caçar entre as abas: quanto falta
   pra viagem, o próximo passeio, como está o cofre e o acerto de contas.
   Cada bloco leva, num toque, pra aba correspondente. Não depende de
   dados sincronizados pra desenhar a primeira tela (contagem regressiva
   é calculada localmente), então é uma abertura acolhedora e robusta. */
/* ---- gasto real vs. planejado (padrão TravelSpend) ----------------
   O "orçamento" de referência é o plano de viagem da pessoa (parte nos
   custos compartilhados + gastos pessoais) espalhado pelos dias da
   viagem. O "real" é a soma dos gastos realizados datados dentro da
   viagem, até hoje. Devolve orçamento diário, gasto acumulado, ritmo e
   se está acima/abaixo do esperado para o dia atual — mais útil que um
   total corrido, porque se ajusta conforme a viagem avança.           */
/* ---- botão flutuante "+ gasto" (registro em 1 toque) --------------
   Durante a viagem, cada toque a mais é atrito. Este atalho abre direto
   o lançamento de um gasto já pago (realizado, datado de hoje) e salva —
   o mesmo lugar que alimenta o cartão "Gasto da viagem" e a aba "Já
   gastei". Aparece só no modo viagem, onde faz sentido. */
function quickGasto(){
  const me=STATE.me;if(!me)return;
