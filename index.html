/* ---- entrar por código (Fase 5) --------------------------
   Busca viagens/{código}, adiciona o uid aos membros e abre.
   As regras do Firestore garantem que só membros leem os dados. */
async function entrarPorCodigo(codigo){
  const raw=(codigo||"").trim();
  if(!raw)return {erro:"Digite o código."};
  if(MOCK||!db||!UID)return {erro:"Sem conexão com o banco."};
  try{
    let id=raw, ref=FB.doc(db,"viagens",id), snap=await FB.getDoc(ref);
    if(!snap.exists()){const up=raw.toUpperCase();if(up!==raw){id=up;ref=FB.doc(db,"viagens",id);snap=await FB.getDoc(ref);}}
    if(!snap.exists())return {erro:"Código não encontrado. Confira as letras."};
    const dd=snap.data()||{};
    if((dd.membros||[]).includes(UID))return {ok:true,id:id,nome:dd.nome||"viagem"};
    const nome=STATE.conta||STATE.me||"Alguém";
    await FB.setDoc(ref,{pendentes:FB.arrayUnion(UID),pendentesInfo:{[UID]:nome},atualizadoEm:(FB.serverTimestamp?FB.serverTimestamp():Date.now())},{merge:true});
    return {pendente:true,id:id,nome:dd.nome||"viagem"};
  }catch(e){console.warn("entrarPorCodigo:",e&&e.code);return {erro:"Não deu pra entrar. Verifique o código."};}
}

/* (6/3) anima os números financeiros do painel ativo para "contar" até o valor.
   Detecta automaticamente os displays de dinheiro grandes e conta de 0 até o valor,
   preservando exatamente o texto final formatado. */
function animarNumeros(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const panel=document.querySelector(".panel-v.on");if(!panel)return;
  // seletor dos displays financeiros com destaque (não anima tabelas/linhas pequenas)
  const alvos=panel.querySelectorAll(".disp.money, .big.money, .hero .pct, .kpi .v.money");
  alvos.forEach(el=>{
    if(el._anim)return;
    const txtFinal=el.textContent;
    // extrai o número do texto (aceita R$ 1.234,56 / US$ 1.234 / € 900 / 25%)
    const m=txtFinal.replace(/\u00a0/g," ").match(/-?[\d.]+(?:,\d+)?/);
    if(!m)return;
    const num=parseFloat(m[0].replace(/\./g,"").replace(",","."));
    if(isNaN(num)||Math.abs(num)<1)return; // não anima 0 ou vazio
    // reconstrói o texto substituindo só a parte numérica, pra manter prefixo/sufixo (R$, %, etc.)
    const casas=(m[0].indexOf(",")>=0)?(m[0].length-m[0].indexOf(",")-1):0;
    const fmtN=v=>txtFinal.replace(m[0],new Intl.NumberFormat("pt-BR",{minimumFractionDigits:casas,maximumFractionDigits:casas}).format(v));
    el._anim=true;
    const dur=560,t0=performance.now();
    function step(t){const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);
      el.textContent=fmtN(num*e);
      if(p<1)requestAnimationFrame(step);else{el.textContent=txtFinal;el._anim=false;}}
    requestAnimationFrame(step);
  });
}

/* ---- 8. CÁLCULOS COMPARTILHADOS ------------------------ */
function itemPeople(it){
  if(!it)return[];
  if(it.quem==="todos"||!Array.isArray(it.quem))return PEOPLE.slice();
  const g=it.quem.filter(p=>PEOPLE.includes(p));
  return g.length?g:PEOPLE.slice();
}
const naMeta=it=>it&&it.naMeta===false?false:true;
/* passeios do roteiro que têm preço viram itens de orçamento automaticamente */
function roteiroItens(){
  const out=[];
  (STATE.roteiro.dias||[]).forEach(d=>(d.itens||[]).forEach(a=>{
    if(Number(a.valor)>0)out.push({id:d.id+"~"+a.id,cat:"Passeios do roteiro",
      desc:a.titulo,valor:Number(a.valor),moeda:a.moeda||"EUR",
      quem:(Array.isArray(a.quem)&&a.quem.length)?a.quem:"todos",naMeta:true});
  }));
  return out;
}
const custoItens=()=>(STATE.custos.itens||[]).concat(roteiroItens());
function shareShared(p,todos){
  let s=0;custoItens().forEach(it=>{
    if(!todos&&!naMeta(it))return;
    const g=itemPeople(it);if(g.includes(p))s+=toBRL(it.valor,it.moeda)/g.length;});
  return s;
}
/* plano = tudo. orçamento/meta = tudo menos o que está fora da meta (passagens) */
const planoDe=p=>shareShared(p,true)+personalTotal(p);
const foraDaMeta=p=>shareShared(p,true)-shareShared(p,false);
const itensPessoais=p=>((STATE.pessoas[p]||{}).pessoais||[]).map(x=>Object.assign({de:"Custos"},x))
  .concat(((STATE.pessoas[p]||{}).compras||[]).filter(x=>Number(x.valor)>0).map(x=>({id:x.id,desc:x.item,valor:x.valor,moeda:x.moeda,de:"Compras"})));
const personalTotal=p=>itensPessoais(p).reduce((a,i)=>a+toBRL(i.valor,i.moeda),0);

const totalShared=()=>custoItens().reduce((a,it)=>a+toBRL(it.valor,it.moeda),0);

let _compraMigrada=false;
function migrarMinhasCompras(){
  if(_compraMigrada)return;
  const me=STATE.me;if(!me||!STATE.pessoas[me])return;
  const compras=meDoc().compras||[];
  if(!compras.length)return;   // não latcheia quando vazio: compras chegam pelo listener depois
  const pessoais=(meDoc().pessoais||[]).slice();
  compras.forEach(c=>{

    pessoais.push({id:uid(),desc:desc||"Compra",cat:"Compras",valor:Number(c.valor)||0,moeda:c.moeda||"EUR"});

  savePessoa(me,{pessoais,compras:[]});
}

let _rendering=false;
/* ---- render seletivo ---------------------------------------------
   Antes, qualquer mudança redesenhava os 7 painéis (inclusive o gráfico).
   Agora só o painel visível é redesenhado; os outros ficam marcados como
   "sujos" e se redesenham na hora em que você entra neles.              */
const RENDERS={inicio:()=>renderInicio(),cofre:()=>renderCofre(),custos:()=>renderCustos(),roteiro:()=>renderRoteiro(),
  compras:()=>renderCompras(),check:()=>renderCheck(),racha:()=>renderRacha(),reservas:()=>renderReservas()};
const _sujo=new Set(Object.keys(RENDERS));
function renderPainel(t){
  const f=RENDERS[t];if(!f)return;
  try{f();}catch(e){console.error("render "+t,e);}
  _sujo.delete(t);
}
function garantirPainel(t){if(_sujo.has(t))renderPainel(t);}
function renderAll(){
  if(!STATE.me||_rendering)return;
  migrarMinhasCompras();
  _rendering=true;
  // só preserva foco de campos fixos do app (busca de mês etc.), nunca de inputs do modal
  const ae=document.activeElement;
  const inModal=ae&&ae.closest&&ae.closest("#modal");
  const aid=(!inModal&&ae&&ae.id)?ae.id:null, asel=aid?ae.selectionStart:null;
  const sy=window.scrollY;
  renderHeader();buildNav();
  Object.keys(RENDERS).forEach(k=>_sujo.add(k)); // os dados mudaram: todos ficam sujos
  renderPainel(curTab);                          // e só o visível é redesenhado agora
  if($("#ajustes")&&!$("#ajustes").classList.contains("hidden"))renderAjustesBody();
  _primeiraCarga=false;
  applyTab();
  window.scrollTo(0,sy);
  if(aid){const el=document.getElementById(aid);if(el&&el.focus){try{el.focus();el.setSelectionRange(asel,asel);}catch(e){}}}
  _rendering=false;
}

    </div>
    <div id="cxout">${linhas()}</div>
    <div class="note">${FXLIVE?"Cotação comercial de "+esc(FXLIVE.src):"Taxa fixa do admin"}. Só referência — casas de câmbio cobram spread.</div>
    <button class="btn gh" id="cxclose" style="margin-top:12px">Fechar</button></div></div>`;

/* ---- Divisor de conta de restaurante --------------------
   Itens (valor + quem consumiu, dividido igualmente entre eles);
   gorjeta e imposto (valor OU %) rateados na proporção do que cada
   um consumiu; um ou mais pagadores com o quanto cada um pôs; no fim,
   vira despesa(s) no racha (uma por pagador, cada devedor sozinho no
   rateio para expressar o valor exato que deve).                     */
let _restState=null;
function abrirRestaurante(){
  const cur=MOEDA_VIAGEM();
  if(!_restState)_restState={
    itens:[{id:uid(),nome:"",valor:"",quem:[]}],
    gorjTipo:"valor",gorjVal:"",  impTipo:"valor",impVal:"",
    pagadores:{} // nome -> quanto colocou (string)
  };
  const S=_restState;
  const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:cur,maximumFractionDigits:2}).format(v||0);

  // ---- cálculos ----
  function calc(){
    const consumo={};PEOPLE.forEach(p=>consumo[p]=0);
    let subtotal=0;
    S.itens.forEach(it=>{
      const v=parseMoney(it.valor)||0;if(v<=0||!it.quem.length)return;
      subtotal+=v;const each=v/it.quem.length;
      it.quem.forEach(p=>{if(consumo[p]!=null)consumo[p]+=each;});
    });
    const gorj=S.gorjTipo==="pct"?subtotal*((parseMoney(S.gorjVal)||0)/100):(parseMoney(S.gorjVal)||0);
    const imp =S.impTipo==="pct" ?subtotal*((parseMoney(S.impVal )||0)/100):(parseMoney(S.impVal )||0);
    const extra=gorj+imp;
    // rateia extra na proporção do consumo
    const total={};PEOPLE.forEach(p=>{
      const share=subtotal>0?consumo[p]/subtotal:0;
      total[p]=consumo[p]+extra*share;
    });
    const grand=subtotal+extra;
    return {consumo,subtotal,gorj,imp,extra,total,grand};
  }

  function render(){
    const R=calc();
    const consumidores=PEOPLE.filter(p=>R.total[p]>0.005);
    const pagPostos=Object.keys(S.pagadores).filter(p=>parseMoney(S.pagadores[p])>0);
    const somaPag=pagPostos.reduce((a,p)=>a+parseMoney(S.pagadores[p]),0);
    const difere=Math.abs(somaPag-R.grand)>0.02;

    $("#modal").innerHTML=`<div class="modal"><div class="box rest-box"><h3>Dividir conta de restaurante</h3>
      <div class="rest-sec">Itens</div>
      <div id="rst-itens">${S.itens.map(it=>`<div class="rst-item" data-it="${it.id}">
        <div class="rst-item-top">
          <input class="rst-nome" data-f="nome" placeholder="Item (ex.: Pizza)" value="${esc(it.nome)}">
          <input class="rst-val" data-f="valor" inputmode="decimal" placeholder="0,00" value="${esc(it.valor)}">
          <button class="x rst-del" aria-label="Remover">✕</button>
        </div>
        <div class="rst-quem">${PEOPLE.map(p=>`<span class="rst-chip ${it.quem.includes(p)?"on":""}" data-p="${esc(p)}">${esc(p)}</span>`).join("")}</div>
      </div>`).join("")}</div>
      <button class="btn gh sm" id="rst-add" style="margin:2px 0 12px">+ Item</button>

      <div class="rest-sec">Gorjeta e imposto</div>
      <div class="f2" style="margin-bottom:8px">
        <div><label class="f">Gorjeta</label>
          <div class="rst-inrow"><input id="rst-gv" inputmode="decimal" placeholder="0" value="${esc(S.gorjVal)}">
            <button class="rst-unit" id="rst-gt">${S.gorjTipo==="pct"?"%":cur}</button></div></div>
        <div><label class="f">Imposto</label>
          <div class="rst-inrow"><input id="rst-iv" inputmode="decimal" placeholder="0" value="${esc(S.impVal)}">
            <button class="rst-unit" id="rst-it">${S.impTipo==="pct"?"%":cur}</button></div></div>
      </div>

      <div class="rest-sec">Quanto cada um deve<span class="rest-grand">${money(R.grand)}</span></div>
      <div id="rst-totwrap">${consumidores.length?`<div class="rst-tot">${consumidores.map(p=>`<div class="rst-totrow">
        <span>${esc(p)}</span>
        <b>${money(R.total[p])}</b></div>`).join("")}
        <div class="rst-totrow rst-sub"><span>Subtotal ${money(R.subtotal)} · gorjeta ${money(R.gorj)} · imposto ${money(R.imp)}</span></div>
        </div>`:`<div class="note">Adicione itens e marque quem consumiu cada um.</div>`}</div>

      <div class="rest-sec">Quem pagou?</div>
      <div class="rst-pags">${PEOPLE.map(p=>{
        const on=S.pagadores[p]!=null;
        const isTotal=on&&Math.abs((parseMoney(S.pagadores[p])||-1)-R.grand)<0.005&&R.grand>0;
        return `<div class="rst-pagrow ${on?"on":""}">
          <span class="rst-chip ${on?"on":""}" data-pag="${esc(p)}">${esc(p)}</span>
          ${on?`<input class="rst-pagval" data-pagv="${esc(p)}" inputmode="decimal" placeholder="quanto pôs" value="${esc(S.pagadores[p]||"")}">
          <label class="rst-totchk"><input type="checkbox" data-pagtot="${esc(p)}" ${isTotal?"checked":""}>Total</label>`:""}</div>`;}).join("")}</div>
      ${pagPostos.length?`<div class="note" id="rst-pagnota" style="margin-top:6px">Pagadores somam ${money(somaPag)} de ${money(R.grand)}${difere?` <b style="color:var(--danger)">— confira, não fecha com o total</b>`:" ✓"}</div>`:`<div class="note" id="rst-pagnota" style="margin-top:6px">Marque quem pagou e quanto cada um colocou.</div>`}

      <div class="rst-actions">
        <button class="btn gh" id="rst-close">Fechar</button>
        <button class="btn" id="rst-add-racha" ${(!consumidores.length||!pagPostos.length||difere)?"disabled":""}>Adicionar ao racha</button>
      </div>
      <div class="note">Cria uma despesa no racha por pagador, com o valor exato que cada pessoa deve. Nada é salvo até você clicar em "Adicionar ao racha".</div>
    </div></div>`;
    wire(R,consumidores,pagPostos,somaPag,difere);
  }

  function wire(R,consumidores,pagPostos,somaPag,difere){
    // itens: nome/valor
    $("#modal").querySelectorAll(".rst-item").forEach(row=>{
      const id=row.dataset.it, it=S.itens.find(x=>x.id===id);if(!it)return;
      row.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{it[inp.dataset.f]=inp.value;/* recalc leve */liveTotals();});
      row.querySelector(".rst-del").onclick=()=>{S.itens=S.itens.filter(x=>x.id!==id);if(!S.itens.length)S.itens=[{id:uid(),nome:"",valor:"",quem:[]}];render();};
      row.querySelectorAll(".rst-chip[data-p]").forEach(ch=>ch.onclick=()=>{
        const p=ch.dataset.p;
        it.quem=it.quem.includes(p)?it.quem.filter(x=>x!==p):it.quem.concat([p]);
        ch.classList.toggle("on",it.quem.includes(p)); // toggle visual sem re-render (evita piscada)
        liveTotals();});
    });
    $("#rst-add").onclick=()=>{S.itens.push({id:uid(),nome:"",valor:"",quem:[]});render();};
    // gorjeta/imposto valores + unidade
    const gv=$("#rst-gv");if(gv)gv.oninput=()=>{S.gorjVal=gv.value;liveTotals();};
    const iv=$("#rst-iv");if(iv)iv.oninput=()=>{S.impVal=iv.value;liveTotals();};
    $("#rst-gt").onclick=()=>{S.gorjTipo=S.gorjTipo==="pct"?"valor":"pct";render();};
    $("#rst-it").onclick=()=>{S.impTipo=S.impTipo==="pct"?"valor":"pct";render();};
    // pagadores: marcar/desmarcar e valor
    $("#modal").querySelectorAll(".rst-chip[data-pag]").forEach(ch=>ch.onclick=()=>{
      const p=ch.dataset.pag;
      if(S.pagadores[p]!=null)delete S.pagadores[p];else S.pagadores[p]="";
      render();});
    $("#modal").querySelectorAll("[data-pagv]").forEach(inp=>inp.oninput=()=>{S.pagadores[inp.dataset.pagv]=inp.value;
      // digitar manualmente desmarca o "Total" se não bater mais
      const chk=$("#modal").querySelector(`[data-pagtot="${inp.dataset.pagv.replace(/"/g,'\\"')}"]`);
      if(chk){const R3=calc();chk.checked=Math.abs((parseMoney(inp.value)||-1)-R3.grand)<0.005&&R3.grand>0;}
      liveTotals();});
    // checkbox "Total": preenche o valor do pagador com o total da conta
    $("#modal").querySelectorAll("[data-pagtot]").forEach(chk=>chk.onchange=()=>{
      const p=chk.dataset.pagtot;const R3=calc();
      S.pagadores[p]=chk.checked?String(R3.grand.toFixed(2)).replace(".",","):"";
      const inp=$("#modal").querySelector(`[data-pagv="${p.replace(/"/g,'\\"')}"]`);
      if(inp)inp.value=S.pagadores[p];
      liveTotals();});
    // recálculo leve dos totais sem re-render (mantém foco nos inputs)
    function liveTotals(){
      const R2=calc();
      const cons=PEOPLE.filter(p=>R2.total[p]>0.005);
      const wrap=$("#modal").querySelector("#rst-totwrap");
      const grandEl=$("#modal").querySelector(".rest-grand");
      if(grandEl)grandEl.textContent=money(R2.grand);
      if(wrap)wrap.innerHTML=cons.length?`<div class="rst-tot">${cons.map(p=>`<div class="rst-totrow"><span>${esc(p)}</span><b>${money(R2.total[p])}</b></div>`).join("")}`+
        `<div class="rst-totrow rst-sub"><span>Subtotal ${money(R2.subtotal)} · gorjeta ${money(R2.gorj)} · imposto ${money(R2.imp)}</span></div></div>`:
        `<div class="note">Adicione itens e marque quem consumiu cada um.</div>`;
      // atualiza aviso de pagadores + estado do botão
      const pag2=Object.keys(S.pagadores).filter(p=>parseMoney(S.pagadores[p])>0);
      const soma2=pag2.reduce((a,p)=>a+parseMoney(S.pagadores[p]),0);
      const dif2=Math.abs(soma2-R2.grand)>0.02;
      const nota=$("#modal").querySelector("#rst-pagnota");
      if(nota)nota.innerHTML=pag2.length?`Pagadores somam ${money(soma2)} de ${money(R2.grand)}${dif2?` <b style="color:var(--danger)">— confira, não fecha com o total</b>`:" ✓"}`:`Marque quem pagou e quanto cada um colocou.`;
      const add2=$("#modal").querySelector("#rst-add-racha");
      if(add2)add2.disabled=(!cons.length||!pag2.length||dif2);
    }
    const close=()=>{$("#modal").innerHTML="";};
    $("#rst-close").onclick=()=>{_restState=null;close();};
    $("#modal").querySelector(".modal").onclick=e=>{if(e.target===e.currentTarget){/* não fecha à toa: pode perder dados */}};
    const add=$("#rst-add-racha");
    if(add)add.onclick=()=>{if(!add.disabled)adicionarAoRacha();};
  }

  // ---- gera as despesas no racha ----
  function adicionarAoRacha(){
    const R=calc();
    const consumidores=PEOPLE.filter(p=>R.total[p]>0.005);
    const pagPostos=Object.keys(S.pagadores).filter(p=>parseMoney(S.pagadores[p])>0);
    const somaPag=pagPostos.reduce((a,p)=>a+parseMoney(S.pagadores[p]),0);
    if(!consumidores.length||!pagPostos.length||Math.abs(somaPag-R.grand)>0.02){
      toast("Confira itens e pagadores antes de adicionar");return;}
    const cur=MOEDA_VIAGEM();
    // quanto cada consumidor deve no total (consumo + rateio de gorjeta/imposto)
    const deve={};consumidores.forEach(p=>deve[p]=R.total[p]);
    // quanto cada pagador colocou
    const posto={};pagPostos.forEach(p=>posto[p]=parseMoney(S.pagadores[p]));
    // 1) cada pagador quita a própria parte primeiro (não vira dívida de ninguém)
    pagPostos.forEach(p=>{if(deve[p]!=null){const usa=Math.min(posto[p],deve[p]);posto[p]-=usa;deve[p]-=usa;}});
    // 2) crédito restante de cada pagador (o que pôs além da própria conta)
    const credTot=pagPostos.reduce((a,p)=>a+Math.max(0,posto[p]),0);
    const devedores=Object.keys(deve).filter(d=>deve[d]>0.005);
    // 3) distribui cada dívida entre os pagadores com crédito, proporcional ao crédito
    const despesas=[];const hoje=new Date().toISOString().slice(0,10);
    devedores.forEach(d=>{
      let restante=Math.round(deve[d]*100); // em centavos, pra fechar exato
      const comCred=pagPostos.filter(p=>posto[p]>0.005);
      comCred.forEach((p,idx)=>{
        if(restante<=0)return;
        const parcela=idx===comCred.length-1?restante:Math.min(restante,Math.round(deve[d]*100*(posto[p]/credTot)));
        if(parcela>0){
          despesas.push({id:uid(),desc:`Restaurante — ${d}`,valor:parcela/100,moeda:cur,pagou:p,entre:[d],data:hoje});
          restante-=parcela;
        }
      });
    });
    if(!despesas.length){toast("Sem dívidas a lançar (cada um pagou a própria parte)");_restState=null;$("#modal").innerHTML="";return;}
    vibrar(16);
    addArr("racha","despesas",despesas);
    _restState=null;$("#modal").innerHTML="";
    const n=despesas.length;
    toast(`${n} lançamento${n>1?"s":""} de restaurante no racha ✓`);
  }

  render();
}

/* ---- 10. COFRE (meta e poupança) ----------------------- */
function depMonths(p){
  const map={};((STATE.pessoas[p]||{}).depositos||[]).forEach(d=>{
    const k=d.mes||monthKey(new Date());map[k]=(map[k]||0)+toBRL(d.valor,d.moeda||"BRL");});
  return map;
}
/* alvo do mês corrente: o que faltava no dia 1 dividido pelos meses que sobram */
const iniPoup=()=>{const v=STATE.config.inicioPoupanca||"";return /^\d{4}-\d{2}$/.test(v)?v:"";};
/* meses que sobram para poupar, contando a partir do início do plano */
function mesesRestantes(){
  const t=ymd(STATE.config.inicio),n=new Date();
  let sy=n.getFullYear(),sm=n.getMonth();
  const ini=iniPoup();
  if(ini){const p=ini.split("-").map(Number);
    if(p[0]>sy||(p[0]===sy&&p[1]-1>sm)){sy=p[0];sm=p[1]-1;}}
  return Math.max(1,(t.getFullYear()-sy)*12+(t.getMonth()-sm));
}
const antesDoPlano=()=>{const i=iniPoup();return !!i&&monthKey(new Date())<i;};
function proxMes(mk){const[y,m]=mk.split("-").map(Number);const d=new Date(y,m,1);return monthKey(d);}
function mesInfo(p){
  const mk=monthKey(new Date()),mr=mesesRestantes(),antes=antesDoPlano();
  const total=guardado(p),noMes=(depMonths(p)[mk]||0);
  /* alvo do mês corrente: o que faltava no início do mês, dividido pelos meses restantes */
  const alvo=Math.max(0,(metaDe(p)-(total-noMes))/mr);
  const cumpriu=!antes&&noMes>=alvo-0.005;
  /* ritmo daqui pra frente: o que ainda falta guardado hoje, dividido pelos meses que sobram DEPOIS deste */
  const faltaTotal=Math.max(0,metaDe(p)-total);
  const mrDepois=Math.max(1,mr-1);
  const ritmoFuturo=faltaTotal>0?faltaTotal/mrDepois:0;
  return {mk:mk,alvo:alvo,guardado:noMes,falta:Math.max(0,alvo-noMes),antes:antes,
          ok:cumpriu,pct:alvo>0?clamp(noMes/alvo*100,0,100):100,meses:mr,
          ritmoFuturo:ritmoFuturo,proximo:proxMes(mk),faltaTotal:faltaTotal,acabou:faltaTotal<=0.005};
}
const CORPESSOA={};
/* ---- modelo de participante (proto-v61, item 1a) --------------------
   Participante deixa de ser só um nome e passa a ser um objeto
   {id, nome, uid?, email?, foto?}. PARTICIPANTES e a fonte de identidade;
   PEOPLE (nomes) continua sendo a interface usada pelo resto do app e e
   DERIVADO daqui — nada downstream precisa mudar. Le tanto o formato
   antigo (lista de strings) quanto o novo (lista de objetos). */
const PARTICIPANTES=[];
let _pidSeq=0;
function genPid(){_pidSeq++;return "p"+Date.now().toString(36)+_pidSeq.toString(36);}
function normParts(raw){
  const arr=Array.isArray(raw)?raw:[];
  const vistos=new Set(),out=[];
  arr.forEach(x=>{
    let o;
    if(x&&typeof x==="object"){
      const nome=String(x.nome||"").trim(); if(!nome)return;
      o={id:x.id||genPid(),nome:nome};
      if(x.uid)o.uid=x.uid;
      if(x.email)o.email=String(x.email).trim().toLowerCase();
      if(x.foto)o.foto=x.foto;
    }else{
      const nome=String(x||"").trim(); if(!nome)return;
      o={id:genPid(),nome:nome};
    }
    const k=normNome(o.nome); if(vistos.has(k))return; vistos.add(k); out.push(o);
  });
  return out;
}
function partDe(nome){const k=normNome(nome||"");return PARTICIPANTES.find(p=>normNome(p.nome)===k)||null;}
function temConta(p){return !!(p&&p.uid);}
function iniciais(nome){return (String(nome||"").trim().charAt(0)||"?").toUpperCase();}
/* avatar foto-ready: usa a foto do participante quando existir; senao, a inicial */
function avatarHTML(p,cls){
  const c=cls?(" "+cls):"";
  if(p&&p.foto)return '<div class="av'+c+'"><img src="'+esc(p.foto)+'" alt=""></div>';
  return '<div class="av'+c+'">'+esc(iniciais(p&&p.nome))+'</div>';
}
/* ---- pessoas por viagem (Fase 4a) ----------------------
   PEOPLE é uma cópia mutável: seu CONTEÚDO é sincronizado com as pessoas
   da viagem aberta (config.pessoas), caindo no grupo da principal quando
   não houver. Como a referência do array não muda, os 65 pontos que usam
   PEOPLE passam a refletir a viagem atual sem precisar tocar em nenhum. */
function recalcCores(){
  const cores=["#E8722E","#1B3A6B","#3E82C4","#1E9E74","#D98A2B","#7A5AC9","#2AA198","#C0507A"];
  Object.keys(CORPESSOA).forEach(k=>delete CORPESSOA[k]);
  PEOPLE.forEach((p,i)=>CORPESSOA[p]=cores[i%cores.length]);
}
function ensurePessoas(){
  PEOPLE.forEach(p=>{if(!STATE.pessoas[p])STATE.pessoas[p]={meta:0,depositos:[],compras:[],checklist:[],pessoais:[],realizados:[],mala:[]};});
}
function sincronizarPessoas(){
  const c=STATE.config&&STATE.config.pessoas;
  const cfg=(Array.isArray(c)&&c.length)?c:(VIAGEM.id==="principal"?DATA.people:[]);
  const parts=normParts(cfg);
  PARTICIPANTES.length=0; parts.forEach(p=>PARTICIPANTES.push(p));
  PEOPLE.length=0; PARTICIPANTES.forEach(p=>PEOPLE.push(p.nome));
  recalcCores(); ensurePessoas();
}

function grupoLinha(){

  const todosMeses=[];PEOPLE.forEach(p=>((STATE.pessoas[p]||{}).depositos||[]).forEach(dep=>{if(dep.mes)todosMeses.push(dep.mes);}));
  if(!todosMeses.length)return "";

  const fimK=[monthKey(new Date())].concat(todosMeses).sort().pop();
  const meses=[];let d=ymd(ini+"-01");let g=0;
  while(monthKey(d)<=fimK&&g++<60){meses.push(monthKey(d));d.setMonth(d.getMonth()+1);}
  if(meses.length<2)return "";

    let run=0;acc[p]=meses.map(k=>{run+=(bym[k]||0);return run;});
  });
  const maxV=Math.max(1,...PEOPLE.map(p=>acc[p][acc[p].length-1]));
  // dados para desenho e interação — o SVG é montado em wireChart, no tamanho real (sem distorção)
  const dados={meses:meses,people:PEOPLE,cor:PEOPLE.map(p=>CORPESSOA[p]),acc:PEOPLE.map(p=>acc[p]),cur:STATE.cur||"BRL",maxV:maxV,rate:{}};
  ["BRL","USD","EUR"].forEach(m=>dados.rate[m]=rate(m));

/* desenha o gráfico no tamanho REAL do container (1 unidade svg = 1px → sem distorção)
   e liga a interação de hover/toque */
function wireChart(){
  const svg=document.getElementById("glchart");if(!svg||!svg.parentElement)return;
  const metaEl=svg.parentElement.querySelector&&svg.parentElement.querySelector(".glmeta");if(!metaEl)return;
  let D;try{D=JSON.parse(metaEl.textContent);}catch(e){return;}
  const tip=document.getElementById("gltip");
  const wrap=svg.parentElement;
  function draw(){
    const W=Math.round(wrap.clientWidth||320);
    // altura conforme viewport (desktop maior)
    const H=window.innerWidth>=900?270:180;
    const pl=12,pr=16,pt=18,pb=28,n=D.meses.length;
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
    svg.setAttribute("width",W);svg.setAttribute("height",H);
    svg.style.height=H+"px";
    svg.style.overflow="visible";
    const x=i=>pl+(i/(n-1))*(W-pl-pr);
    const y=v=>H-pb-(v/D.maxV)*(H-pt-pb);
    // grade horizontal em 4 níveis, com o valor de referência à esquerda
    const niveis=[0,.25,.5,.75,1];
    const grid=niveis.map(f=>{const yy=(pt+(H-pt-pb)*(1-f));
      return `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1" shape-rendering="crispEdges"/>`;}).join("");
    const linhas=D.people.map((p,pi)=>{
      const pts=D.acc[pi].map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      const last=D.acc[pi][D.acc[pi].length-1];
      return `<polyline points="${pts}" fill="none" stroke="${D.cor[pi]}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`+
             `<circle cx="${x(n-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3.4" fill="${D.cor[pi]}"/>`;
    }).join("");
    const step=Math.max(1,Math.ceil(n/(W>560?12:6)));
    const labs=D.meses.map((k,i)=>(i%step&&i!==n-1)?"":`<text x="${x(i).toFixed(1)}" y="${H-9}" fill="var(--dim)" font-size="10.5" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600">${monthLabel(k)}</text>`).join("");
    svg.innerHTML=`${grid}${labs}${linhas}
      <line id="glcursor" x1="0" y1="${pt}" x2="0" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="opacity:0"/>
      <g id="gldots"></g>`;
    svg._geo={W:W,H:H,pl:pl,pr:pr,pt:pt,pb:pb,x:x,y:y,n:n};
  }
  draw();
  const conv=(brl)=>{const r=D.rate[D.cur]||1;return D.cur==="BRL"?brl:brl/r;};
  const money=(brl)=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:D.cur||"BRL",maximumFractionDigits:0}).format(conv(brl));
  function show(clientX){
    const geo=svg._geo;if(!geo)return;
    const cur=document.getElementById("glcursor"),dots=document.getElementById("gldots");
    const box=svg.getBoundingClientRect();
    const rel=(clientX-box.left)/box.width;
    let i=Math.round(rel*(geo.n-1));i=Math.max(0,Math.min(geo.n-1,i));
    const px=geo.x(i);
    if(cur){cur.setAttribute("x1",px);cur.setAttribute("x2",px);cur.style.opacity="1";}
    if(dots)dots.innerHTML=D.people.map((p,pi)=>`<circle cx="${px.toFixed(1)}" cy="${geo.y(D.acc[pi][i]).toFixed(1)}" r="4.5" fill="${D.cor[pi]}" stroke="var(--panel)" stroke-width="2"/>`).join("");
    const linhas=D.people.map((p,pi)=>({p:p,c:D.cor[pi],v:D.acc[pi][i]})).sort((a,b)=>b.v-a.v);
    tip.innerHTML=`<div class="tt-h">${esc(monthLabel(D.meses[i]))}</div>`+
      linhas.map(l=>`<div class="tt-r"><span><i style="background:${l.c}"></i>${esc(l.p)}</span><b>${money(l.v)}</b></div>`).join("");
    // canto superior oposto ao cursor — nunca em cima dos pontos
    const wrapR=wrap.getBoundingClientRect();
    const relW=(clientX-wrapR.left)/wrapR.width; // 0..1 dentro do card
    const tw=tip.offsetWidth||140;
    let left = relW < 0.5 ? (wrapR.width-tw-6) : 6;
    left=Math.max(4,Math.min(wrapR.width-tw-4,left));
    tip.style.left=left+"px";tip.style.top="2px";tip.style.opacity="1";
  }
  function hide(){const cur=document.getElementById("glcursor"),dots=document.getElementById("gldots");
    if(cur)cur.style.opacity="0";if(dots)dots.innerHTML="";tip.style.opacity="0";}
  svg.addEventListener("mousemove",e=>show(e.clientX));
  svg.addEventListener("mouseleave",hide);
  let scrubX=0;
  svg.addEventListener("touchstart",e=>{if(e.touches[0]){scrubX=e.touches[0].clientX;show(e.touches[0].clientX);}},{passive:true});
  svg.addEventListener("touchmove",e=>{
    if(!e.touches[0])return;
    const dx=Math.abs(e.touches[0].clientX-scrubX);
    // se o dedo se move na horizontal sobre o gráfico, é para navegar o gráfico:
    // impede a rolagem/troca de aba da página
    if(dx>4&&e.cancelable)e.preventDefault();
    e.stopPropagation();
    show(e.touches[0].clientX);
  },{passive:false});
  svg.addEventListener("touchend",e=>{e.stopPropagation();hide();});
  // redesenha se a largura mudar (girar tela / redimensionar janela)
  if(window._glResize)window.removeEventListener("resize",window._glResize);
  window._glResize=()=>{if(document.getElementById("glchart")===svg)draw();};
  window.addEventListener("resize",window._glResize);
}

/* ---- 11b. INÍCIO (resumo simples da viagem) --------------------
   Reúne num só lugar, em linguagem simples e sem tabelas, o que cada
   pessoa precisa saber sem ter que caçar entre as abas: quanto falta
   pra viagem, o próximo passeio, como está o cofre e o acerto de contas.
   Cada bloco leva, num toque, pra aba correspondente. Não depende de
   dados sincronizados pra desenhar a primeira tela (contagem regressiva
   é calculada localmente), então é uma abertura acolhedora e robusta. */
/* ---- gasto real vs. planejado (padrão TravelSpend) ----------------
   O "orçamento" de referência é o plano de viagem da pessoa (parte nos
   custos compartilhados + gastos pessoais) espalhado pelos dias da
   viagem. O "real" é a soma dos gastos realizados datados dentro da
   viagem, até hoje. Devolve orçamento diário, gasto acumulado, ritmo e
   se está acima/abaixo do esperado para o dia atual — mais útil que um
   total corrido, porque se ajusta conforme a viagem avança.           */
/* ---- botão flutuante "+ gasto" (registro em 1 toque) --------------
   Durante a viagem, cada toque a mais é atrito. Este atalho abre direto
   o lançamento de um gasto já pago (realizado, datado de hoje) e salva —
   o mesmo lugar que alimenta o cartão "Gasto da viagem" e a aba "Já
   gastei". Aparece só no modo viagem, onde faz sentido. */

function gastoVsPlano(me){
  const c=STATE.config, ini=ymd(c.inicio), fim=ymd(c.fim);
  const totDias=Math.max(1,Math.round((fim-ini)/86400000)+1);
  const hoje=ymd(hojeViagem());
  // dia atual dentro da viagem (1..totDias); antes=0, depois=totDias
  let diaAtual=Math.round((hoje-ini)/86400000)+1;
  diaAtual=Math.max(0,Math.min(totDias,diaAtual));
  const plano=planoDe(me);                 // orçamento total de viagem da pessoa (BRL)
  const porDia=plano/totDias;
  // realizados datados dentro da janela da viagem
  const reals=(meusRealizados(me)||[]).filter(r=>{
    const d=ymd(r.data); return d>=ini && d<=fim;
  });
  const gasto=reals.reduce((a,r)=>a+toBRL(r.valor,r.moeda),0);
  const gastoTotal=realizadoTotal(me);   // TODOS os gastos (igual à aba Dinheiro), sem filtro de data
  const gastoAteHoje=reals.filter(r=>ymd(r.data)<=hoje).reduce((a,r)=>a+toBRL(r.valor,r.moeda),0);
  const esperadoAteHoje=porDia*Math.max(0,Math.min(totDias,diaAtual));
  const diff=gastoAteHoje-esperadoAteHoje;   // >0 acima do previsto
  const diasCorridos=Math.max(1,Math.min(totDias,diaAtual));
  const mediaDia=gastoAteHoje/diasCorridos;
  const diasRestantes=Math.max(0,totDias-diaAtual);
  const restante=Math.max(0,plano-gastoTotal);
  const sobraPorDia=diasRestantes>0?restante/diasRestantes:0;
  // ---- verba real (dinheiro que a pessoa levou) ----
  const cofre=guardado(me);
  const verba=Number((STATE.pessoas[me]||{}).verba)||0;   // ajuste manual opcional
  const disponivel=verba>0?verba:cofre;                    // fonte unica: ajuste ou cofre
  const temDisponivel=disponivel>0;
  const ajustada=verba>0;
  const temVerba=verba>0;
  const saldoReal=Math.max(0,disponivel-gastoTotal);      // quanto ainda tem
  // "a partir de amanhã": divide pelos dias estritamente após hoje
  const diasDepoisDeHoje=Math.max(0,totDias-Math.max(0,diaAtual));
  const podeGastarDia=diasDepoisDeHoje>0?saldoReal/diasDepoisDeHoje:saldoReal;
  // gasto por dia da viagem (para o mini-gráfico)
  const porDiaArr=[];
  for(let i=0;i<totDias;i++){
    const dk=new Date(ini);dk.setDate(dk.getDate()+i);
    const iso=dk.toISOString().slice(0,10);
    const g=reals.filter(r=>String(r.data).slice(0,10)===iso).reduce((a,r)=>a+toBRL(r.valor,r.moeda),0);
    porDiaArr.push(g);
  }
  return {totDias,diaAtual,plano,porDia,gasto,gastoTotal,gastoAteHoje,esperadoAteHoje,diff,mediaDia,
          diasRestantes,restante,sobraPorDia,porDiaArr,temReal:reals.length>0,
          verba,temVerba,cofre,disponivel,temDisponivel,ajustada,saldoReal,diasDepoisDeHoje,podeGastarDia};
}

  // ---- 2. próximo passeio (ou primeira parada, antes da viagem) ----
  const dias=(STATE.roteiro.dias||[]).slice().sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  const prox=proximosPasseios(dias);
  let roteiroCard;
  if(prox.length){const p0=prox[0],cid=cityOf(p0.dia.cidade);

    </div>`;
  }else{const d0=dias[0];
    roteiroCard=`<div class="ini-card" data-goto="roteiro" role="button" tabindex="0">
      <div class="ini-h"><span class="ini-ic">${svgIcon("roteiro")}</span><span class="ini-t">Roteiro</span><span class="ini-go">ver roteiro ›</span></div>
      <div class="ini-big">${d0?esc(d0.titulo||cityOf(d0.cidade).n):"A montar"}</div>
      <div class="ini-sub">${cidades.length?cidades.length+" cidades · "+cidades.map(x=>esc(x.n)).join(", "):"O admin monta os dias por aqui"}</div>
    </div>`;
  }

  // ---- 3. meu cofre (uma linha + barra) ----
  const meta=metaDe(me),sav=guardado(me),pctC=meta>0?clamp(sav/meta*100,0,100):0,doneC=sav>=meta&&meta>0;
  const semMetaC=meta<=0;
  const cofreCard=semMetaC?`<div class="ini-card" data-goto="cofre" role="button" tabindex="0">
    <div class="ini-h"><span class="ini-ic">${svgIcon("cofre")}</span><span class="ini-t">Meu cofre</span><span class="ini-go">definir meta ›</span></div>
    <div class="ini-big" style="font-size:18px">Defina quanto quer juntar</div>
    <div class="ini-sub">A meta aparece aqui — calculada dos custos ou definida por você.</div>
  </div>`:`<div class="ini-card" data-goto="cofre" role="button" tabindex="0">
    <div class="ini-h"><span class="ini-ic">${svgIcon("cofre")}</span><span class="ini-t">Meu cofre</span><span class="ini-go">ver cofre ›</span></div>
    <div class="ini-row"><div class="ini-line">${doneC?"Meta batida 🎉":"Já guardei <b>"+Math.round(pctC)+"%</b> da meta"}</div><div class="ini-pct ${doneC?"ok":""}">${Math.round(pctC)}%</div></div>
    <div class="rail ${doneC?"ok":""}" style="margin:8px 0 2px"><i style="width:${pctC}%"></i></div>
    <div class="ini-sub">${fmt(sav)} de ${fmt(meta)}</div>
  </div>`;

  // ---- 4. racha (quite / deve / a receber) ----
  let rachaCard="";
  {const bal=balances(),cents=bal[me]||0,fmtMO2=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:MOEDA_VIAGEM(),minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0);
   let linha,tom;
   if(Math.abs(cents)<1){linha="Você está quite ✓";tom="ok";}
   else if(cents<0){linha=`Você deve <b>${fmtMO2(-cents/100)}</b>`;tom="dgr";}
   else{linha=`Têm a te devolver <b>${fmtMO2(cents/100)}</b>`;tom="";}
   const temMov=(STATE.racha.despesas||[]).length||(STATE.racha.pagamentos||[]).length;
   rachaCard=`<div class="ini-card" data-goto="racha" role="button" tabindex="0">
     <div class="ini-h"><span class="ini-ic">${svgIcon("racha")}</span><span class="ini-t">Divisão de contas</span><span class="ini-go">ver racha ›</span></div>
     <div class="ini-line ini-${tom}">${temMov?linha:"Nada lançado ainda"}</div>
     <div class="ini-sub">${temMov?"Toque para ver quem paga quem":"As despesas em comum entram aqui"}</div>

  // ---- 5. gasto do dia vs. planejado (só no modo viagem) ----
  let gastoCard="";

    const acima=G.diff>0.5, tom=acima?"dgr":"ok";

    // mini-barras por dia (destaca o dia atual)
    const maxDia=Math.max(1,...G.porDiaArr,G.porDia);
    const barras=G.porDiaArr.map((g,i)=>{

    }).join("");

      (acima ? `Você está <b>${fmt(Math.abs(G.diff))}</b> acima do previsto até aqui.` :
               `Você está dentro do previsto — <b>${fmt(Math.abs(G.diff))}</b> de folga.`);
    // bloco da verba real (o "quanto posso gastar por dia" com base no que levei)
    let verbaBloco;
    if(G.temDisponivel){
      verbaBloco=`<div class="gd-stats">
        <div class="gd-scol"><div class="gd-sk">Disponível${G.ajustada?"":" (cofre)"}</div><div class="gd-sv money">${fmt(G.disponivel)}</div></div>
        <div class="gd-scol"><div class="gd-sk">Ainda tenho</div><div class="gd-sv money ok">${fmt(G.saldoReal)}</div></div>
      </div>
      <div class="gd-acts">
        <button class="btn sm" data-quick="1">+ Lançar gasto</button>
        <button class="btn sec sm" data-verba="1">Ajustar</button>
      </div>`;
    }else{
      verbaBloco=`<div class="gd-acts">
        <button class="btn sm" data-quick="1">+ Lançar gasto</button>
        <button class="btn sec sm" data-verba="1">Definir disponível</button>
      </div>
      <div class="ini-line-sm" style="margin-top:8px">Guarde no <b>cofre</b> ou informe quanto levou pra ver <b>quanto pode gastar por dia</b>.</div>`;
    }
    gastoCard=`<div class="ini-card" data-goto="custos" role="button" tabindex="0">
      <div class="ini-h"><span class="ini-ic">${svgIcon("custos")}</span><span class="ini-t">Gasto da viagem</span>${infoBtn("Comparamos o que você já gastou (lançado em Custos › Já gastei) com o seu plano. Se você informar a verba que levou, calculamos também quanto dá pra gastar por dia com o que ainda sobra.")}<span class="ini-go">ver custos ›</span></div>
      <div class="ini-row">
        <div class="grow"><div class="ini-big money">${fmt(G.gastoTotal)}</div>
          <div class="ini-sub">${G.temDisponivel?`de ${fmt(G.disponivel)} disponível${G.ajustada?"":" (do cofre)"}`:`de ${fmt(G.plano)} planejados`}</div></div>
        <div class="gd-day"><div class="gd-day-k">dia</div><div class="gd-day-n">${Math.max(0,G.diaAtual)}</div><div class="gd-day-l">de ${G.totDias}</div></div>
      </div>
      ${(G.temDisponivel||G.plano>0)?`<div class="gd-allow"><span>Pode gastar por dia</span><b class="money">${fmt(G.temDisponivel?G.podeGastarDia:G.sobraPorDia)}</b></div><div class="ini-line-sm">${G.diasRestantes>0?`Média pelos <b>${G.diasRestantes}</b> ${G.diasRestantes===1?"dia que falta":"dias que faltam"}${G.temDisponivel?", com base no que você tem":", com base no seu orçamento"}.`:"Último dia da viagem — aproveite o que sobrou."}</div>`:""}
      <div class="rail ${((G.temDisponivel?G.saldoReal:G.restante)<=0)?"dgr":"ok"}" style="margin:9px 0 4px"><i style="width:${G.temDisponivel?(G.disponivel>0?clamp(G.saldoReal/G.disponivel*100,0,100):0):(G.plano>0?clamp(G.restante/G.plano*100,0,100):0)}%"></i></div>
      ${G.porDiaArr.some(g=>g>0)?`<div class="gd-chart">${barras}</div>`:""}
      ${G.temReal||G.temDisponivel?verbaBloco:`<div class="ini-line-sm ini-${tom}">Lance seus gastos em Custos › Já gastei para acompanhar aqui.</div><button class="btn sec sm" data-verba="1" style="margin-top:9px;width:100%">Definir quanto tenho pra viagem</button>`}
    </div>`;
  }

  $("#p-inicio").innerHTML=`
  ${emV?`${roteiroCard}${gastoCard}${ehSolo()?"":rachaCard}${cofreCard}`:`${cofreCard}${roteiroCard}${ehSolo()?"":rachaCard}`}
  <div class="note" style="text-align:center;margin-top:4px">Toque em qualquer cartão para abrir a aba completa.</div>`;

  // navegação: cada cartão abre a aba correspondente (menos ao tocar no (i) ou na verba)
  $("#p-inicio").querySelectorAll("[data-goto]").forEach(el=>{
    const ir=(e)=>{if(e&&e.target&&e.target.closest&&e.target.closest(".ibtn, [data-verba], [data-quick]"))return;show(el.dataset.goto);};
    el.onclick=ir;
    el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();ir(e);}};
  });
  $("#p-inicio").querySelectorAll("[data-verba]").forEach(el=>el.onclick=e=>{e.stopPropagation();verbaModal();});
  $("#p-inicio").querySelectorAll("[data-quick]").forEach(el=>el.onclick=e=>{e.stopPropagation();quickGasto();});

}

/* modal da verba de viagem (dinheiro que a pessoa levou, por pessoa) */
function verbaModal(){
  const me=STATE.me;if(!me)return;
  const atual=Number((STATE.pessoas[me]||{}).verba)||0;
  const cofre=guardado(me);
  const sugestao=atual>0?atual:cofre;   // concilia com o cofre: sugere o que você guardou
  const lbl="Quanto você levou (em "+STATE.cur+")"+(atual<=0&&cofre>0?" — você guardou "+fmt(cofre)+" no cofre":"");
  openModal("Minha verba de viagem",[
    {id:"verba",label:lbl,type:"money",
     value:sugestao>0?disp(sugestao).toFixed(2).replace(".",","):"",placeholder:"0,00"}
  ],v=>{
    savePessoa(me,{verba:v.verba>0?toBRL(v.verba,STATE.cur):0});
    toast(v.verba>0?"Verba salva ✓":"Verba removida");
  },"Salvar");
}

/* ---- templates de mala (por pessoa) -------------------------------
   A pessoa pode salvar a lista atual como um template nomeado (ex.:
   "Europa frio") e recarregar depois numa próxima viagem, sem montar
   tudo de novo. Carregar adiciona os itens que faltam, sem duplicar. */
function malaTplSalvar(){
  const me=STATE.me;if(!me)return;
  const mala=meDoc().mala||[];
  if(!mala.length){toast("A lista está vazia");return;}
  openModal("Salvar como template",[
    {id:"nome",label:"Nome do template",value:"",placeholder:"Ex.: Europa frio, Praia…"}
  ],v=>{
    if(!v.nome){toast("Dê um nome ao template");return false;}
    const tpls=(meDoc().malaTpls||[]).slice();
    const itens=mala.map(i=>({item:i.item,cat:i.cat||""}));
    const jaTem=tpls.findIndex(t=>t.nome.toLowerCase()===v.nome.toLowerCase());
    if(jaTem>-1)tpls[jaTem]={id:tpls[jaTem].id,nome:v.nome,itens};
    else tpls.push({id:uid(),nome:v.nome,itens});
    savePessoa(me,{malaTpls:tpls});
    toast("Template salvo ✓");
  },"Salvar template");
}
function malaTplCarregar(){
  const me=STATE.me;if(!me)return;
  const tpls=meDoc().malaTpls||[];
  if(!tpls.length){
    $("#modal").innerHTML=`<div class="modal"><div class="box"><h3>Templates de mala</h3>
      <div class="note" style="margin:2px 0 12px">Você ainda não salvou nenhum template. Monte sua mala e toque em <b>salvar esta lista</b> para reaproveitar depois.</div>
      <button class="btn" id="mtpl-x">Entendi</button></div></div>`;
    const c=()=>{$("#modal").innerHTML="";};$("#mtpl-x").onclick=c;
    $("#modal").querySelector(".modal").onclick=e=>{if(e.target===e.currentTarget)c();};
    return;
  }
  $("#modal").innerHTML=`<div class="modal"><div class="box"><h3>Usar um template</h3>
    <div class="note" style="margin:2px 0 10px">Adiciona os itens à sua mala (sem duplicar o que já existe).</div>
    <div class="tpl-list">${tpls.map(t=>`<div class="tpl-it">
      <div class="tpl-info"><div class="tpl-n">${esc(t.nome)}</div><div class="tpl-s">${t.itens.length} ${t.itens.length===1?"item":"itens"}</div></div>
      <button class="btn sm" data-tload="${t.id}">Usar</button>
      <button class="x" data-tdel="${t.id}" aria-label="Excluir template">✕</button>
    </div>`).join("")}</div>
    <button class="btn gh" id="mtpl-x" style="margin-top:10px">Fechar</button></div></div>`;
  const close=()=>{$("#modal").innerHTML="";};
  $("#mtpl-x").onclick=close;
  $("#modal").querySelector(".modal").onclick=e=>{if(e.target===e.currentTarget)close();};
  $("#modal").querySelectorAll("[data-tload]").forEach(b=>b.onclick=()=>{
    const t=tpls.find(x=>x.id===b.dataset.tload);if(!t)return;
    const mala=(meDoc().mala||[]).slice();
    const existentes=new Set(mala.map(i=>(i.item||"").toLowerCase().trim()));
    let add=0;
    t.itens.forEach(it=>{const k=(it.item||"").toLowerCase().trim();if(k&&!existentes.has(k)){
      mala.push({id:uid(),item:it.item,ok:false,cat:it.cat||""});existentes.add(k);add++;}});
    savePessoa(me,{mala});
    close();toast(add?`${add} ${add===1?"item adicionado":"itens adicionados"} ✓`:"Todos os itens já estavam na lista");
  });
  $("#modal").querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{
    const tpls2=(meDoc().malaTpls||[]).filter(x=>x.id!==b.dataset.tdel);
    savePessoa(me,{malaTpls:tpls2});toast("Template excluído");malaTplCarregar();
  });
}

/* ---- realizados (gastos efetivos, por pessoa) ----------- */
const meusRealizados=p=>((STATE.pessoas[p]||{}).realizados||[]);
const realizadoTotal=p=>meusRealizados(p).reduce((a,r)=>a+toBRL(r.valor,r.moeda),0);
const realizadoBRL=p=>realizadoTotal(p);
/* quanto do plano da pessoa já foi "coberto" pela categoria de cada gasto realizado — comparação simples por total */
function comparativo(p){
  const plan=planoDe(p), real=realizadoTotal(p);
  return {plan:plan,real:real,dif:real-plan};
}

/* ---- 12. MODAL GENÉRICO -------------------------------- */
function openModal(title,fields,onSave,saveLabel){
  const body=fields.map(f=>{
    if(f.type==="select")
      return `<div class="fld"><label class="f">${esc(f.label)}</label><select id="m_${f.id}">${
        (f.options||[]).map(o=>{const v=typeof o==="object"?o.v:o,l=typeof o==="object"?o.l:o;
        return `<option value="${esc(v)}" ${String(v)===String(f.value)?"selected":""}>${esc(l)}</option>`;}).join("")}</select></div>`;
    if(f.type==="chips")
      return `<div class="fld"><label class="f">${esc(f.label)}</label><div class="chips" id="m_${f.id}">${
        PEOPLE.map(p=>`<span class="chip ${(f.value||[]).indexOf(p)>-1?"on":""}" data-p="${esc(p)}">${esc(p)}</span>`).join("")}</div></div>`;
    if(f.type==="area")
      return `<div class="fld"><label class="f">${esc(f.label)}</label><textarea id="m_${f.id}" rows="3" placeholder="${esc(f.placeholder||"")}">${esc(f.value||"")}</textarea></div>`;
    if(f.type==="cat"){
      const cats=categorias(),val=f.value||cats[0];
      return `<div class="fld"><label class="f">${esc(f.label)}</label>
        <select id="m_${f.id}">${cats.map(o=>`<option value="${esc(o)}" ${o===val?"selected":""}>${esc(o)}</option>`).join("")}<option value="__nova__">+ Nova categoria…</option></select>
        <input id="m_${f.id}_nova" placeholder="Nome da nova categoria" style="margin-top:7px;display:none"></div>`;
    }
    const t=f.type==="money"?"text":(f.type||"text");
    return `<div class="fld"><label class="f">${esc(f.label)}</label><input id="m_${f.id}" type="${t}" ${f.type==="money"?'inputmode="decimal"':""} value="${esc(f.value==null?"":f.value)}" placeholder="${esc(f.placeholder||"")}"></div>`;
  }).join("");
  $("#modal").innerHTML=`<div class="modal"><div class="box"><h3>${esc(title)}</h3>${body}
    <div class="row" style="gap:8px;margin-top:6px">
      <button class="btn gh" id="mcancel" style="flex:1">Cancelar</button>
      <button class="btn" id="mok" style="flex:2">${esc(saveLabel||"Salvar")}</button></div></div></div>`;
  const close=()=>{$("#modal").innerHTML="";};
  $("#mcancel").onclick=close;
  $("#modal").querySelector(".modal").onclick=e=>{if(e.target===e.currentTarget)close();};
  fields.filter(f=>f.type==="chips").forEach(f=>{
    $("#m_"+f.id).querySelectorAll(".chip").forEach(c=>c.onclick=()=>c.classList.toggle("on"));});
  fields.filter(f=>f.type==="cat").forEach(f=>{
    const sel=$("#m_"+f.id),inp=$("#m_"+f.id+"_nova");
    sel.onchange=()=>{const nova=sel.value==="__nova__";inp.style.display=nova?"block":"none";if(nova)inp.focus();};});
  $("#mok").onclick=()=>{
    const out={};
    fields.forEach(f=>{
      if(f.type==="chips")out[f.id]=Array.from($("#m_"+f.id).querySelectorAll(".chip.on")).map(c=>c.dataset.p);
      else if(f.type==="money")out[f.id]=parseMoney($("#m_"+f.id).value);
      else if(f.type==="cat"){const sel=$("#m_"+f.id);
        out[f.id]=sel.value==="__nova__"?($("#m_"+f.id+"_nova").value.trim()||"Outros"):sel.value;}
      else out[f.id]=$("#m_"+f.id).value.trim();
    });
    // recolhe o teclado do celular antes de mexer no DOM (evita travar a WebView no mobile)
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    // fecha o modal primeiro; salva logo depois, já sem o modal e sem o teclado na tela
    const salvar=()=>onSave(out);
    // valida antes de fechar: onSave retorna false quando falta algo
    let ok=true; try{ok=(salvar()!==false);}catch(e){console.error(e);toast("Erro ao salvar");ok=true;}
    if(ok)close();
    else{const first=$("#modal")&&$("#modal").querySelector("input,select,textarea");if(first&&first.focus)setTimeout(()=>{try{first.focus();}catch(e){}},40);}
  };
}

/* "feito" agora vive num mapa roteiro.feitos[idAtividade], gravado com merge:
   dois marcando passeios diferentes ao mesmo tempo não se apagam. Ainda lê o
   formato antigo (feito dentro do item) para não perder o que já foi marcado. */
function feitoDe(a){
  const m=(STATE.roteiro&&STATE.roteiro.feitos)||{};
  return Object.prototype.hasOwnProperty.call(m,a.id)?!!m[a.id]:!!a.feito;
}
async function marcarFeito(ai,val){
  const m=Object.assign({},(STATE.roteiro&&STATE.roteiro.feitos)||{});
  m[ai]=!!val;
  STATE.roteiro=Object.assign({},STATE.roteiro,{feitos:m});
  renderAll();
  if(MOCK){saveLocal();return;}
  try{await FB.setDoc(caminho("roteiro"),{feitos:{[ai]:!!val}},{merge:true});}
  catch(e){console.error(e);toast("Erro ao salvar: "+String((e&&e.code)||(e&&e.message)||e).slice(0,60));}
}
/* próximos passeios (não concluídos) a partir de agora, durante a viagem */
function proximosPasseios(dias){
  const agora=new Date(agoraViagemStr()+":00");
  const out=[];
  dias.forEach(d=>{
    const base=String(d.data).slice(0,10);
    (d.itens||[]).forEach(a=>{
      if(feitoDe(a))return;
      let quando=new Date(base+"T"+((/^\d{1,2}:\d{2}$/.test(a.hora||"")?a.hora:"23:59"))+":00");
      out.push({dia:d,a:a,quando:quando,base:base});
    });
  });
  return out.filter(x=>x.quando>=new Date(agora.getTime()-3*3600*1000)) // tolera passeio em andamento (3h)
    .sort((x,y)=>x.quando-y.quando);
}

/* ---- 14c. RESERVAS & DOCUMENTOS ------------------------
   Cofre offline das confirmações da viagem: voo, hotel, trem, seguro e
   cópias de documentos. É um doc compartilhado (viagem/reservas): todo
   mundo vê e pode adicionar. Cada item pode ter localizador, link e
   endereço (abre no mapa). Excluir mostra "Desfazer".               */
const RESV_TIPOS=["Voo","Hotel","Trem","Transfer","Passeio","Seguro","Documento"];
function resvCategorias(){
  const usados=[...new Set(resvItens().map(x=>x.tipo).filter(Boolean))];
  return RESV_TIPOS.concat(usados.filter(c=>!RESV_TIPOS.includes(c)));
}
function resvItens(){return ((STATE.reservas&&STATE.reservas.itens)||[]).slice();}
function abrirFormReserva(at){
  const NOVA="➕ Nova categoria…";
  const cats=resvCategorias().slice();
  if(at&&at.tipo&&!cats.includes(at.tipo))cats.unshift(at.tipo);
  openModal(at?"Editar documento":"Novo documento",[
    {id:"tipo",label:"Categoria",type:"select",options:cats.concat([NOVA]),value:at?at.tipo:"Hotel"},
    {id:"titulo",label:"Título",placeholder:"Ex.: Hotel Paris — 5 noites",value:at?at.titulo:""},
    {id:"quando",label:"Data (opcional)",type:"date",value:at?(at.quando||""):""},
    {id:"codigo",label:"Localizador / confirmação (opcional)",placeholder:"Ex.: 6-QK2P9",value:at?(at.codigo||""):""},
    {id:"link",label:"Link (opcional)",placeholder:"https://…",value:at?(at.link||""):""},
    {id:"local",label:"Endereço / local — abre no mapa (opcional)",placeholder:"Ex.: 10 Rue de Rivoli, Paris",value:at?(at.local||""):""},
    {id:"quem",label:"De quem é",type:"chips",value:(at&&Array.isArray(at.quem)&&at.quem.length)?at.quem.slice():PEOPLE.slice()},
    {id:"nota",label:"Observação (opcional)",type:"area",placeholder:"opcional",value:at?(at.nota||""):""}
  ],v=>{
    if(!v.titulo){toast("Dê um título");return false;}
    const salvar=(tipo)=>{
      const item={id:at?at.id:uid(),tipo:tipo||"Documento",titulo:v.titulo};
      if(v.quando)item.quando=v.quando;
      if(v.codigo)item.codigo=v.codigo;
      if(v.link)item.link=v.link;
      if(v.local)item.local=v.local;
      if(v.nota)item.nota=v.nota;
      item.quem=(v.quem.length&&v.quem.length<PEOPLE.length)?v.quem:"todos";
      if(at){saveDoc("reservas",{itens:resvItens().map(x=>x.id===at.id?item:x)});toast("Documento atualizado");}
      else{addArr("reservas","itens",item);toast("Documento adicionado");}
    };
    if(v.tipo===NOVA){
      setTimeout(()=>openModal("Nova categoria",[
        {id:"nome",label:"Nome da categoria",placeholder:"Ex.: Ingressos"}
      ],vc=>{ if(!vc.nome){toast("Dê um nome à categoria");return false;} salvar(vc.nome.trim()); }),40);
      return;
    }
    salvar(v.tipo);
  });
}
/* ---- Tarefas do grupo (checklist compartilhado com responsável) ---- */
function tarefasItens(){return ((STATE.tarefas&&STATE.tarefas.itens)||[]).slice();}
function abrirFormTarefa(at){
  openModal(at?"Editar tarefa":"Nova tarefa",[
    {id:"texto",label:"Tarefa",placeholder:"Ex.: Reservar ingressos do Louvre",value:at?at.texto:""},
    {id:"quem",label:"Responsável",type:"select",options:["A definir"].concat(PEOPLE),value:(at&&at.quem)?at.quem:"A definir"},
    {id:"prazo",label:"Prazo (opcional)",type:"date",value:at?(at.prazo||""):""}
  ],v=>{
    if(!v.texto){toast("Escreva a tarefa");return false;}
    const item={id:at?at.id:uid(),texto:v.texto,quem:v.quem||"A definir",feito:at?!!at.feito:false};
    if(v.prazo)item.prazo=v.prazo;
    if(at&&at.por&&item.feito)item.por=at.por;
    if(at){saveDoc("tarefas",{itens:tarefasItens().map(x=>x.id===at.id?item:x)});toast("Tarefa atualizada");}
    else{addArr("tarefas","itens",item);toast("Tarefa adicionada");}
  });
}
function tarefasBloco(){
  const its=tarefasItens();
  const feitas=its.filter(x=>x.feito).length;
  const pend=its.filter(x=>!x.feito), pron=its.filter(x=>x.feito);
  const linha=(x)=>`<div class="li ${x.feito?"done":""}">
      <div class="tick ${x.feito?"on":""}" data-ttog="${x.id}" role="button" tabindex="0">✓</div>
      <div class="t"><div class="n">${esc(x.texto)}</div>
        <div class="s">${x.quem&&x.quem!=="A definir"?esc(x.quem):'<span style="color:var(--warn)">sem responsável</span>'}${x.prazo?" · até "+esc(fmtDate(x.prazo)):""}${x.feito&&x.por?" · feito por "+esc(x.por):""}</div></div>
      <button class="x" data-tedit="${x.id}" aria-label="Editar">✎</button>
      <button class="x" data-tdel="${x.id}" aria-label="Excluir">✕</button></div>`;
  return `<div class="${checkView==="tarefas"?"":"hidden"}">
    <div class="card tight">
      <div class="row"><div class="grow"><div class="lbl">Tarefas do grupo</div>
        <div class="disp" style="font-size:26px">${feitas} <span style="font-size:15px;color:var(--muted);font-family:Inter">de ${its.length}</span></div></div>
        <button class="btn sm" id="taradd">+ Tarefa</button></div>
      <div class="note" style="margin-top:8px">Quem faz o quê antes de viajar — reservas, ingressos, documentos. É compartilhado: todo mundo vê, edita e marca como feito.</div>
    </div>
    ${its.length?
      ((pend.length?`<div class="sect">A fazer<span class="r">${pend.length}</span></div>`+pend.map(linha).join(""):'<div class="okbox">Tudo feito! 🎉</div>')+
      (pron.length?`<div class="sect">Feitas<span class="r">${pron.length}</span></div>`+pron.map(linha).join(""):""))
      :'<div class="empty">Nenhuma tarefa ainda.<br>Adicione o que precisa ser resolvido e defina o responsável.</div>'}
  </div>`;
}
function wireTarefas(){
  const a=$("#taradd");if(a)a.onclick=()=>abrirFormTarefa(null);
  $("#p-check").querySelectorAll("[data-ttog]").forEach(b=>b.onclick=()=>{
    const it=tarefasItens().find(x=>x.id===b.dataset.ttog);if(!it)return;
    const novo=Object.assign({},it,{feito:!it.feito});
    if(novo.feito)novo.por=STATE.me;else delete novo.por;
    saveDoc("tarefas",{itens:tarefasItens().map(x=>x.id===it.id?novo:x)});vibrar(8);});
  $("#p-check").querySelectorAll("[data-tedit]").forEach(b=>b.onclick=()=>{
    const it=tarefasItens().find(x=>x.id===b.dataset.tedit);if(it)abrirFormTarefa(it);});
  $("#p-check").querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{
    const it=tarefasItens().find(x=>x.id===b.dataset.tdel);if(!it)return;
    delArr("tarefas","itens",it);toastUndo("Tarefa excluída",()=>addArr("tarefas","itens",it));});
}

function balances(){
  const b={};PEOPLE.forEach(p=>b[p]=0);
  (STATE.racha.despesas||[]).forEach(d=>{
    const cents=Math.round(toMO(d.valor,d.moeda)*100);
    if(b[d.pagou]!=null)b[d.pagou]+=cents;
    // split por porcentagem (quando definido e válido); senão, igual entre "entre"
    const pctOk=d.pct&&typeof d.pct==="object"&&Math.abs(Object.values(d.pct).reduce((a,x)=>a+(Number(x)||0),0)-100)<0.01;
    if(pctOk){
      const nomes=Object.keys(d.pct).filter(p=>b[p]!=null&&Number(d.pct[p])>0);
      let usado=0;
      nomes.forEach((p,i)=>{
        const parte=i===nomes.length-1?cents-usado:Math.round(cents*Number(d.pct[p])/100);
        usado+=parte;b[p]-=parte;
      });
    }else{
      const g=(Array.isArray(d.entre)&&d.entre.length?d.entre:PEOPLE).filter(p=>b[p]!=null);
      if(!g.length)return;
      const each=Math.floor(cents/g.length),resto=cents-each*g.length;
      g.forEach((p,i)=>b[p]-=each+(i<resto?1:0));
    }
  });
  (STATE.racha.pagamentos||[]).forEach(t=>{
    const cents=Math.round(toMO(t.valor,t.moeda)*100);
    if(b[t.de]!=null)b[t.de]+=cents;
    if(b[t.para]!=null)b[t.para]-=cents;
  });
  return b;
}
/* menor número possível de transferências.
   1) parte os saldos no MAIOR número de grupos que fecham em zero
      (busca exata por bitmask — grupos independentes nunca precisam
       trocar dinheiro entre si);
   2) dentro de cada grupo, casa sempre o maior devedor com o maior
      credor, então todo pagamento vai de quem deve para quem tem
      a receber, sem ninguém virar intermediário.                    */
function grupoGuloso(names,vals){
  const a=names.map((n,i)=>({n:n,v:vals[i]})).filter(x=>x.v!==0),out=[];
  let guard=0;
  while(guard++<400){
    a.sort((x,y)=>x.v-y.v);
    const d=a[0],c=a[a.length-1];
    if(!d||!c||d.v>=0||c.v<=0)break;
    const amt=Math.min(-d.v,c.v);
    out.push({de:d.n,para:c.n,v:amt});
    d.v+=amt;c.v-=amt;
  }
  return out;
}
function settle(bal){
  const names=[],vals=[];
  Object.keys(bal).forEach(k=>{if(bal[k]!==0){names.push(k);vals.push(bal[k]);}});
  const n=names.length;
  if(!n)return[];
  if(n>14)return grupoGuloso(names,vals);
  const size=1<<n,soma=new Array(size).fill(0);
  for(let m=1;m<size;m++){const low=m&(-m),i=31-Math.clz32(low);soma[m]=soma[m&(m-1)]+vals[i];}
  const best=new Array(size).fill(-1),pick=new Array(size).fill(0);
  best[0]=0;
  for(let m=1;m<size;m++){
    const low=m&(-m);
    for(let sub=m;sub>0;sub=(sub-1)&m){
      if(!(sub&low))continue;
      if(soma[sub]!==0)continue;
      const r=best[m^sub];
      if(r>=0&&r+1>best[m]){best[m]=r+1;pick[m]=sub;}
    }
  }
  let m=size-1;
  if(best[m]<0)return grupoGuloso(names,vals);
  const out=[];
  while(m>0){
    const g=pick[m],idx=[];
    for(let i=0;i<n;i++)if(g&(1<<i))idx.push(i);
    out.push.apply(out,grupoGuloso(idx.map(i=>names[i]),idx.map(i=>vals[i])));
    m^=g;
  }
  return out.sort((x,y)=>y.v-x.v);
}

      <div class="pctsum" id="d_pctsum"></div>
    </div>
    <div class="fld"><label class="f">Data</label><input id="d_data" type="date" value="${base.data}"></div>
    <div class="row" style="gap:8px;margin-top:6px">
      <button class="btn gh" id="d_cancel" style="flex:1">Cancelar</button>
      <button class="btn" id="d_ok" style="flex:2">${isEdit?"Salvar":"Lançar"}</button></div>
  </div></div>`;
  const close=()=>{$("#modal").innerHTML="";};
  $("#d_cancel").onclick=close;
  $("#modal").querySelector(".modal").onclick=e=>{if(e.target===e.currentTarget)close();};
  let modo=base.modo;
  const seg=$("#d_modo");
  seg.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>{
    modo=x.dataset.m;seg.querySelectorAll("[data-m]").forEach(y=>y.classList.toggle("on",y===x));
    $("#d_igualwrap").style.display=modo==="pct"?"none":"";
    $("#d_pctwrap").style.display=modo==="pct"?"":"none";
    atualizaPct();
  });
  $("#d_entre").querySelectorAll(".chip").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
  const valorAtual=()=>parseMoney($("#d_valor").value)||0;
  const somaPct=()=>PEOPLE.reduce((a,p)=>{const el=$("#d_pctwrap").querySelector(`[data-p="${p}"]`);return a+(parseMoney(el.value)||0);},0);
  function atualizaPct(){
    if(modo!=="pct")return;
    const val=valorAtual(),soma=somaPct();
    PEOPLE.forEach(p=>{const pc=parseMoney($("#d_pctwrap").querySelector(`[data-p="${p}"]`).value)||0;
      $(`[data-cash="${p}"]`).textContent=val>0&&pc>0?fmtIn(val*pc/100,$("#d_moeda").value):"—";});
    const falta=100-soma,el=$("#d_pctsum");
    if(Math.abs(falta)<0.01){el.textContent="Soma 100% ✓";el.className="pctsum ok";}
    else if(falta>0){el.textContent=`Falta ${(+falta.toFixed(1))}%`+(val>0?` · ${fmtIn(val*falta/100,$("#d_moeda").value)}`:"");el.className="pctsum falta";}
    else{el.textContent=`Passou ${(+(-falta).toFixed(1))}%`;el.className="pctsum falta";}
  }
  $("#d_pctwrap").querySelectorAll(".pctinp").forEach(i=>i.oninput=atualizaPct);
  $("#d_valor").addEventListener("input",atualizaPct);
  $("#d_moeda").addEventListener("change",atualizaPct);
  atualizaPct();
  $("#d_ok").onclick=()=>{
    const desc=$("#d_desc").value.trim(),valor=valorAtual(),moeda=$("#d_moeda").value,
      pagou=$("#d_pagou").value,data=$("#d_data").value||hoje;
    if(!desc||valor<=0){toast("Preencha descrição e valor");return;}
    let payload;
    if(modo==="pct"){
      const soma=somaPct();
      if(Math.abs(soma-100)>=0.01){toast("As porcentagens precisam somar 100%");return;}
      const pct={};PEOPLE.forEach(p=>{const v=parseMoney($("#d_pctwrap").querySelector(`[data-p="${p}"]`).value)||0;if(v>0)pct[p]=v;});
      payload={desc,valor,moeda,pagou,data,pct};
    }else{
      const entre=Array.from($("#d_entre").querySelectorAll(".chip.on")).map(c=>c.dataset.p);
      if(!entre.length){toast("Escolha entre quem dividir");return;}
      payload={desc,valor,moeda,pagou,data,entre};
    }
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    close();
    if(isEdit)saveDoc("racha",{despesas:(STATE.racha.despesas||[]).map(x=>x.id===d.id?Object.assign({id:d.id},payload):x)});
    else addArr("racha","despesas",Object.assign({id:uid()},payload));
    toast(isEdit?"Despesa atualizada":"Despesa lançada");
  };
}

function moedasDosDestinos(){

  ((STATE.config&&STATE.config.cidades)||[]).forEach(c=>{const loc=resolverLocal(c.n);const m=loc&&loc.moedaISO;if(m&&MOEDAS_DB.some(([cc])=>cc===m))cnt[m]=(cnt[m]||0)+1;});

/* ---- (1) deslizar entre abas + (2) puxar pra atualizar ---- */
(function gestos(){
  const app=document.getElementById("app");if(!app)return;
  let x0=0,y0=0,t0=0,drag=false,pull=false,hor=null;
  const ordem=()=>TABS().map(t=>t[0]).concat(isAdmin()?["admin"]:[]);
  const bar=document.createElement("div");bar.id="ptr";bar.innerHTML='<span class="ptrspin"></span>';
  document.body.appendChild(bar);
  const painel=()=>document.querySelector(".panel-v.on");
  function irLado(dir){
    const o=ordem(),i=o.indexOf(curTab);if(i<0)return;
    const n=i+dir;if(n<0||n>=o.length)return;
    // anima a saída do painel atual na direção do gesto, depois troca e anima a entrada
    const atual=painel();
    if(atual){atual.style.transition="transform .18s ease, opacity .18s ease";
      atual.style.transform=`translateX(${dir>0?-40:40}px)`;atual.style.opacity="0";}
    vibrar(8);
    setTimeout(()=>{
      show(o[n]);
      const novo=painel();
      if(novo){novo.style.transition="none";novo.style.transform=`translateX(${dir>0?60:-60}px)`;novo.style.opacity="0";
        requestAnimationFrame(()=>{novo.style.transition="transform .24s cubic-bezier(.2,.7,.3,1), opacity .24s ease";
          novo.style.transform="";novo.style.opacity="1";
          setTimeout(()=>{novo.style.transition="";},260);});}
      if(atual){atual.style.transition="";atual.style.transform="";atual.style.opacity="";}
    },140);
  }
  function limpaDrag(){const p=painel();if(p){p.style.transition="transform .2s ease";p.style.transform="";setTimeout(()=>{if(p)p.style.transition="";},220);}}
  app.addEventListener("touchstart",e=>{
    if(e.touches.length!==1)return;
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();drag=true;hor=null;
    pull=(window.scrollY<=0);
  },{passive:true});
  app.addEventListener("touchmove",e=>{
    if(!drag)return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    // decide a direção do gesto uma vez
    if(hor===null&&(Math.abs(dx)>8||Math.abs(dy)>8))hor=Math.abs(dx)>Math.abs(dy);
    if(pull&&!hor&&dy>0){
      const d=Math.min(90,dy*.5);bar.style.transform=`translateY(${d}px)`;bar.style.opacity=Math.min(1,d/60);
      if(d>=60)bar.classList.add("ready");else bar.classList.remove("ready");
    }
    // arrasto lateral: o painel segue o dedo (com resistência nas bordas)
    if(hor){
      const alvo=e.target.closest&&e.target.closest(".seg, .deplist, table, input, textarea, select, .chartwrap");
      if(!alvo){
        const o=ordem(),i=o.indexOf(curTab);
        const borda=(dx>0&&i<=0)||(dx<0&&i>=o.length-1);
        const mov=borda?dx*.25:dx*.6; // resistência se não há aba pra ir
        const p=painel();if(p){p.style.transition="none";p.style.transform=`translateX(${mov}px)`;p.style.opacity=String(Math.max(.55,1-Math.abs(mov)/500));}
      }
    }
  },{passive:true});
  app.addEventListener("touchend",e=>{
    if(!drag)return;drag=false;
    const t=e.changedTouches[0];const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    // pull-to-refresh
    if(pull&&!hor&&dy>60){
      bar.classList.add("spin");bar.style.transform="translateY(64px)";bar.style.opacity="1";vibrar(14);
      Promise.resolve(carregarFX(true)).finally(()=>{setTimeout(()=>{
        bar.classList.remove("spin","ready");bar.style.transform="";bar.style.opacity="0";toast("Atualizado ✓");},600);});
    }else{bar.classList.remove("ready");bar.style.transform="";bar.style.opacity="0";}
    // swipe horizontal concluído?
    if(hor){
      const alvo=e.target.closest&&e.target.closest(".seg, .deplist, table, input, textarea, select, .chartwrap");
      const disparou=Math.abs(dx)>70&&dt<700;
      if(!alvo&&disparou)irLado(dx<0?1:-1);
      else limpaDrag(); // não passou do limite: volta o painel pro lugar
    }
  },{passive:true});
})();

/* ---- Service worker: o app abre mesmo sem internet ------------------
   Guarda o casco do app no aparelho. Quando sai uma versão nova,
   mostra uma faixa oferecendo atualizar em vez de exigir refresh forçado. */
(function offlineApp(){
  if(!("serviceWorker" in navigator))return;
  if(location.protocol==="file:")return; // não funciona em file://
  const registrar=()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("SW:",e));
  // este script é um módulo com await: pode terminar depois do "load"
  if(document.readyState==="complete")registrar();
  else window.addEventListener("load",registrar);
  let avisado=false;
  const MARCA="./__update__";
  navigator.serviceWorker.addEventListener("message",e=>{
    if(e.data&&e.data.type==="update-ready")mostrar();
  });
  // o SW deixa um marcador no cache; a revalidação termina depois do load,
  // então conferimos algumas vezes nos primeiros segundos
  async function temAtualizacao(){
    try{
      const ks=await caches.keys();
      for(const k of ks){const c=await caches.open(k);if(await c.match(MARCA))return true;}
    }catch(e){}
    return false;
  }
  async function limparMarca(){
    try{const ks=await caches.keys();for(const k of ks){const c=await caches.open(k);await c.delete(MARCA);}}catch(e){}
  }
  function mostrar(){if(!avisado){avisado=true;faixaAtualizar();}}
  [1500,4000,8000].forEach(t=>setTimeout(async()=>{if(!avisado&&await temAtualizacao())mostrar();},t));
  function faixaAtualizar(){
    if(document.getElementById("upbar"))return;
    const d=document.createElement("div");
    d.id="upbar";
    d.innerHTML='<span>Nova versão disponível</span><button id="upgo">Atualizar</button>';
    document.body.appendChild(d);
    requestAnimationFrame(()=>d.classList.add("on"));
    d.querySelector("#upgo").onclick=async()=>{
      await limparMarca();
      try{if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:"skip-waiting"});}catch(err){}
      location.reload();
    };
  }
})();
